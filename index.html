/** Public "کمک مالی آنلاین" page: financial-transparency totals + a form that
 *  starts a ZarinPal payment and redirects the browser to the gateway. No
 *  login is required, and donations here always go to the general fund. */
function renderDonate(){
  const stats = state.donatePublicStats;
  const quickAmounts = [200000, 500000, 1000000, 5000000];
  const result = state.donateResult;

  const wrap = el(`<div class="admin-login-wrap" style="max-width:560px;">
    ${result ? `
    <div class="card" style="margin-bottom:16px; border:1.5px solid ${result.status === 'success' ? 'var(--success)' : 'var(--danger)'}; background:${result.status === 'success' ? 'var(--success-bg)' : 'rgba(192,57,43,0.08)'};">
      ${result.status === 'success' ? `
        <h3 style="margin-top:0; color:var(--success);">${ICONS.check} پرداخت با موفقیت انجام شد</h3>
        <div style="font-size:13.5px;">از همراهی شما سپاسگزاریم. این کمک مالی ثبت شد و صرف درمان مددجویان موسسه خواهد شد.
        ${result.ref ? `<br>کد پیگیری: <strong style="direction:ltr; display:inline-block;">${escapeHtml(result.ref)}</strong>` : ''}</div>
      ` : `
        <h3 style="margin-top:0; color:var(--danger);">پرداخت ناموفق بود</h3>
        <div style="font-size:13.5px;">پرداخت شما تکمیل نشد یا توسط شما لغو شد. هیچ مبلغی از حساب شما کسر نشده است. می‌توانید دوباره تلاش کنید.</div>
      `}
      <button type="button" class="btn-outline" id="donate-result-close" style="margin-top:10px;">متوجه شدم</button>
    </div>
    ` : ''}

    <div class="card admin-card">
      <div class="admin-icon-circle">${ICONS.check}</div>
      <h2>کمک مالی آنلاین</h2>
      <div class="sub">کمک شما مستقیم صرف هزینه‌های درمانی مددجویان موسسه خیریه درمانی مهر جاوید می‌شود.</div>

      ${stats ? `
      <div class="acct-summary-grid" style="margin:16px 0;">
        <div class="acct-summary-card"><div class="num" style="color:var(--success);">${formatToman(stats.totalRaised)}</div><div class="label">مجموع کمک‌های جمع‌آوری‌شده</div></div>
        <div class="acct-summary-card"><div class="num" style="color:var(--primary-dark);">${formatToman(stats.totalAidDisbursed)}</div><div class="label">پرداختی به مددجویان</div></div>
        <div class="acct-summary-card"><div class="num" style="font-size:17px;">${Number(stats.casesHelped).toLocaleString('fa-IR')}</div><div class="label">پرونده حمایت‌شده</div></div>
        <div class="acct-summary-card"><div class="num" style="font-size:17px;">${Number(stats.donorCount).toLocaleString('fa-IR')}</div><div class="label">خیر همراه موسسه</div></div>
      </div>
      ` : `<div class="skeleton-block" style="height:70px; margin:16px 0;"></div>`}

      <form id="donate-form">
        <div class="field">
          <label>مبلغ کمک (تومان)</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
            ${quickAmounts.map(a => `<button type="button" class="btn-outline donate-amount-btn" data-amount="${a}" style="flex:1; min-width:100px; ${state.donateAmount === a && !state.donateCustomAmount ? 'background:var(--primary); color:#fff; border-color:var(--primary);' : ''}">${formatToman(a)}</button>`).join('')}
          </div>
          <input type="text" id="donate-custom-amount" inputmode="numeric" placeholder="مبلغ دلخواه (تومان)" value="${state.donateCustomAmount ? Number(state.donateCustomAmount).toLocaleString('en-US') : ''}">
        </div>
        <div class="field">
          <label>نام <span class="hint">(اختیاری)</span></label>
          <input type="text" id="donate-name" maxlength="120">
        </div>
        <div class="field">
          <label>شماره موبایل <span class="hint">(برای ارسال رسید و پیگیری — اختیاری)</span></label>
          <input type="text" id="donate-phone" inputmode="numeric" maxlength="11" placeholder="۰۹xxxxxxxxx">
        </div>
        <button type="submit" class="submit-btn" id="donate-submit-btn">${ICONS.check} پرداخت و کمک به موسسه</button>
      </form>
      <div style="font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:10px;">پرداخت از طریق درگاه امن زرین‌پال انجام می‌شود.</div>
    </div>
  </div>`);

  const closeBtn = wrap.querySelector('#donate-result-close');
  if(closeBtn) closeBtn.onclick = ()=>{ state.donateResult = null; render(); };

  wrap.querySelectorAll('.donate-amount-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.donateAmount = parseInt(btn.dataset.amount, 10);
      state.donateCustomAmount = '';
      render();
    });
  });

  const customInput = wrap.querySelector('#donate-custom-amount');
  customInput.addEventListener('input', (e)=>{
    const digits = e.target.value.replace(/[^\d]/g, '');
    state.donateCustomAmount = digits;
    e.target.value = digits ? Number(digits).toLocaleString('en-US') : '';
  });

  wrap.querySelector('#donate-phone').addEventListener('input', (e)=>{ e.target.value = e.target.value.replace(/[^0-9]/g, ''); });

  wrap.querySelector('#donate-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const amount = state.donateCustomAmount ? parseInt(state.donateCustomAmount, 10) : state.donateAmount;
    if(!amount || amount < 10000){ showToast('حداقل مبلغ کمک آنلاین ۱۰٬۰۰۰ تومان است', 'danger'); return; }
    const phone = wrap.querySelector('#donate-phone').value.trim();
    if(phone && !/^0\d{10}$/.test(phone)){ showToast('شماره موبایل معتبر نیست', 'danger'); return; }
    const name = wrap.querySelector('#donate-name').value.trim();
    const btn = wrap.querySelector('#donate-submit-btn');
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      const data = await apiCallCsrf('donation_request_payment', { amount, name, phone });
      window.location.href = data.paymentUrl;
    }catch(err){
      btn.disabled = false;
      showToast(err.message || 'خطا در اتصال به درگاه پرداخت', 'danger');
    }
  });

  return wrap;
}

        <button type="submit" class="submit-btn" id="otp-verify-btn">${ICONS.check} تایید و ورود</button>
        <button type="button" class="submit-btn secondary" id="otp-resend-btn" style="margin-top:10px;">ارسال مجدد کد</button>
        `}
      </form>
      `}
    </div>
    <div style="text-align:center; margin-top:16px;">
      <a href="#donate" id="go-donate-link" style="color:var(--primary); font-weight:700; text-decoration:underline; font-size:14px;">${ICONS.check} حامی مددجویان ما باشید — کمک مالی آنلاین</a>
    </div>
  </div>`);

  wrap.querySelector('#mode-password').onclick = () => { state.loginMode = 'password'; state.otpSent = false; render(); };
  wrap.querySelector('#mode-sms').onclick = () => { state.loginMode = 'sms'; render(); };
  wrap.querySelector('#go-donate-link').addEventListener('click', (e)=>{
    e.preventDefault();
    state.view = 'donate';
    render();
    loadDonatePublicStats();
  });

  if(!smsMode){
    wrap.querySelector('#ul-register-btn').onclick = () => { state.view = 'userRegister'; state.regOtpSent = false; state.regPhoneVerified = ''; render(); };
    wrap.querySelector('#user-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const idOrUser = wrap.querySelector('#ul-nid').value.trim();
      const pass = wrap.querySelector('#ul-pass').value;
      const err = wrap.querySelector('#err-ul-login');
      err.classList.remove('show');

      const btn = wrap.querySelector('#user-login-form button[type="submit"]');
      btn.disabled = true;

      if(validateNationalId(idOrUser)){
        try{
          const data = await apiCallCsrf('user_login', { nationalId: idOrUser, password: pass });
          state.currentUser = data.user;
          state.view = 'userDashboard';
          loadNotifications().then(render);
          render();
        }catch(err2){
          btn.disabled = false;
          err.textContent = err2.message || "کد ملی یا رمز عبور اشتباه است.";
          err.classList.add('show');
        }
        return;
      }

      // Not a valid national ID format — treat as an admin username attempt.
      try{
        let data = await apiCallCsrf('admin_login', { username: idOrUser, password: pass });
        if(data.needsTotp){
          data = await showTotpPrompt();
          if(!data){ btn.disabled = false; return; } // cancelled
        }
        state.previousLogin = data.previousLogin || null;
        state.currentAdminUsername = idOrUser;
        await bootstrap(); // refresh adminRole/settings now that the session is authenticated
        if(data.mustChangePassword){
          showToast('برای امنیت بیشتر، لطفاً رمز پیش‌فرض را همین حالا تغییر دهید', 'danger');
        }
        await enterDashboard();
        if(data.mustChangePassword){
          state.showPwModal = true;
          render();
        }
      }catch(err2){
        btn.disabled = false;
        err.textContent = 'کد ملی/نام کاربری یا رمز عبور اشتباه است.';
        err.classList.add('show');
      }
    });
  } else {
    wrap.querySelector('#user-otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = wrap.querySelector('#err-ul-otp');
      err.classList.remove('show');

      if(!state.otpSent){
        const phone = wrap.querySelector('#ul-phone').value.trim();
        if(!/^0\d{10}$/.test(phone)){
          err.textContent = 'شماره موبایل معتبر نیست.';
          err.classList.add('show');
          return;
        }
        const btn = wrap.querySelector('#otp-send-btn');
        btn.disabled = true;
        try{
          const data = await apiCallCsrf('otp_request', { phone, purpose: 'login' });
          state.otpSent = true;
          state.otpPhone = phone;
          state.otpMaskedPhone = data.maskedPhone || phone;
          state.otpExpiresAt = Date.now() + 120000;
          render();
          startOtpCountdown('ul-otp-timer', state.otpExpiresAt);
        }catch(err2){
          btn.disabled = false;
          err.textContent = err2.message || 'ارسال کد ممکن نشد.';
          err.classList.add('show');
        }
      } else {
        const code = wrap.querySelector('#ul-otp-code').value.trim();
        const btn = wrap.querySelector('#otp-verify-btn');
        btn.disabled = true;
        try{
          const data = await apiCallCsrf('otp_verify', { phone: state.otpPhone, code, purpose: 'login' });
          state.currentUser = data.user;
          state.view = 'userDashboard';
          state.otpSent = false;
          loadNotifications().then(render);
          render();
        }catch(err2){
          btn.disabled = false;
          err.textContent = err2.message || 'کد وارد شده نامعتبر یا منقضی شده است.';
          err.classList.add('show');
        }
      }
    });
    const resendBtn = wrap.querySelector('#otp-resend-btn');
    if(resendBtn){
      resendBtn.onclick = async () => {
        resendBtn.disabled = true;
        try{
          const data = await apiCallCsrf('otp_request', { phone: state.otpPhone, purpose: 'login' });
          state.otpMaskedPhone = data.maskedPhone || state.otpMaskedPhone;
          state.otpExpiresAt = Date.now() + 120000;
          startOtpCountdown('ul-otp-timer', state.otpExpiresAt);
          showToast('کد جدید ارسال شد');
        }catch(err2){
          showToast(err2.message || 'ارسال کد ممکن نشد', 'danger');
        }
        resendBtn.disabled = false;
      };
    }
  }

  if(smsMode && state.otpSent && state.otpExpiresAt){
    startOtpCountdown('ul-otp-timer', state.otpExpiresAt);
  }

  wirePasswordToggles(wrap);
  return wrap;
}

/** Wires the phone-verification controls. Never rebuilds or replaces the #ur-phone input itself —
 *  only toggles .disabled and shows/hides sibling elements — so nothing the user typed is ever lost. */
function wirePhoneVerification(wrap){
  const phoneInput = wrap.querySelector('#ur-phone');
  const sendBtn = wrap.querySelector('#ur-send-otp');
  const changeBtn = wrap.querySelector('#ur-change-phone');
  const badge = wrap.querySelector('#ur-phone-verified-badge');
  const otpSection = wrap.querySelector('#ur-otp-section');
  const err = wrap.querySelector('#err-ur-phone');

  function showOtpInput(){
    otpSection.innerHTML = `
      <div style="margin-top:10px; display:flex; gap:8px;">
        <input type="text" id="ur-otp-code" maxlength="5" inputmode="numeric" placeholder="کد پیامکی" style="flex:1;">
        <button type="button" id="ur-verify-otp" class="btn-outline" style="white-space:nowrap;">تایید کد</button>
      </div>
      <span class="otp-timer" id="ur-otp-timer"></span>
      <div class="error-text" id="err-ur-otp">کد وارد شده نامعتبر یا منقضی شده است.</div>
    `;
    state.otpExpiresAt = Date.now() + 120000;
    startOtpCountdown('ur-otp-timer', state.otpExpiresAt);
    otpSection.querySelector('#ur-verify-otp').onclick = async () => {
      const code = otpSection.querySelector('#ur-otp-code').value.trim();
      const otpErr = otpSection.querySelector('#err-ur-otp');
      const verifyBtn = otpSection.querySelector('#ur-verify-otp');
      verifyBtn.disabled = true;
      try{
        await apiCallCsrf('otp_verify', { phone: state.otpPhone, code, purpose: 'register' });
        state.regPhoneVerified = state.otpPhone;
        otpSection.innerHTML = '';
        sendBtn.style.display = 'none';
        badge.style.display = 'flex';
        changeBtn.style.display = 'inline-block';
        showToast('شماره موبایل تایید شد');
      }catch(e){
        verifyBtn.disabled = false;
        otpErr.textContent = e.message || 'کد وارد شده نامعتبر یا منقضی شده است.';
        otpErr.classList.add('show');
      }
    };
  }

  phoneInput.addEventListener('input', (e)=>{ e.target.value = e.target.value.replace(/[^0-9]/g,''); });

  sendBtn.onclick = async () => {
    const phone = phoneInput.value.trim();
    if(!/^0\d{10}$/.test(phone)){
      err.textContent = 'شماره موبایل معتبر نیست.';
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    sendBtn.disabled = true;
    try{
      await apiCallCsrf('otp_request', { phone, purpose: 'register' });
      state.otpPhone = phone;
      phoneInput.disabled = true;
      sendBtn.style.display = 'none';
      changeBtn.style.display = 'inline-block';
      showOtpInput();
      showToast('کد تایید ارسال شد');
    }catch(e){
      sendBtn.disabled = false;
      err.textContent = e.message || 'ارسال کد ممکن نشد.';
      err.classList.add('show');
    }
  };

  changeBtn.onclick = () => {
    state.regOtpSent = false;
    state.regPhoneVerified = '';
    phoneInput.disabled = false;
    sendBtn.style.display = 'inline-flex';
    sendBtn.disabled = false;
    badge.style.display = 'none';
    changeBtn.style.display = 'none';
    otpSection.innerHTML = '';
    err.classList.remove('show');
  };
}

/** Reads the appointment from/to Jalali date selects. This field is optional overall
 *  (returns true if left completely empty) but if the person starts filling it in,
 *  both the "from" and "to" date must be complete and "from" must not be after "to". */
function validateApptRange(wrap){
  const fd = wrap.querySelector('#f-appt-from-day')?.value;
  const fm = wrap.querySelector('#f-appt-from-month')?.value;
  const fy = wrap.querySelector('#f-appt-from-year')?.value;
  const td = wrap.querySelector('#f-appt-to-day')?.value;
  const tm = wrap.querySelector('#f-appt-to-month')?.value;
  const ty = wrap.querySelector('#f-appt-to-year')?.value;
  const allEmpty = !fd && !fm && !fy && !td && !tm && !ty;
  if(allEmpty) return true;
  if(!fd || !fm || !fy || !td || !tm || !ty) return false;
  const fromKey = `${fy}${fm}${String(fd).padStart(2,'0')}`;
  const toKey = `${ty}${tm}${String(td).padStart(2,'0')}`;
  return fromKey <= toKey;
}

/** Validates only the fields belonging to a given wizard step; used by the "Next" button. */
function validateWizardStep(wrap, step){
  const setErr = (id, show)=>{
    const input = wrap.querySelector('#f-' + id);
    const err = wrap.querySelector('#err-' + id);
    if(input) input.classList.toggle('invalid', show);
    if(err) err.classList.toggle('show', show);
  };
  if(step === 1){
    const specialty = wrap.querySelector('#f-specialty').value;
    const visitType = wrap.querySelector('#f-visit-type').value;
    const problemDesc = wrap.querySelector('#f-problem-desc').value.trim();
    let ok = true;
    if(!specialty){ setErr('specialty', true); ok = false; } else setErr('specialty', false);
    if(!visitType){ setErr('visit-type', true); ok = false; } else setErr('visit-type', false);
    if(!problemDesc){ setErr('problem-desc', true); ok = false; } else setErr('problem-desc', false);
    if(!validateApptRange(wrap)){ setErr('appt-range', true); ok = false; } else setErr('appt-range', false);
    return ok;
  }
  if(step === 2){
    const needsAccommodation = wrap.querySelector('#f-needs-accommodation').checked;
    if(!needsAccommodation){
      setErr('days', false); setErr('comp-count', false); setErr('comp-phone', false);
      const namesErr = wrap.querySelector('#err-comp-names');
      if(namesErr) namesErr.classList.remove('show');
      return true;
    }
    const days = wrap.querySelector('#f-days').value.trim();
    const compCount = wrap.querySelector('#f-comp-count').value.trim();
    const compPhone = wrap.querySelector('#f-comp-phone').value.trim();
    const companionNames = state.companionNames.map(n => (n || '').trim());
    let ok = true;
    if(!days || !/^\d+$/.test(days)){ setErr('days', true); ok = false; } else setErr('days', false);
    if(!compCount || !/^\d+$/.test(compCount) || parseInt(compCount,10) < 1){ setErr('comp-count', true); ok = false; } else setErr('comp-count', false);
    if(!/^0\d{10}$/.test(compPhone) || compPhone === state.currentUser?.phone){ setErr('comp-phone', true); ok = false; } else setErr('comp-phone', false);
    const namesOk = companionNames.length > 0 && companionNames.every(n => n.length > 0);
    const fatherNamesOk = state.companionFatherNames.length === companionNames.length && state.companionFatherNames.every(n => (n || '').trim().length > 0);
    const nidsOk = state.companionNationalIds.length === companionNames.length && state.companionNationalIds.every(id => validateNationalId(id || ''));
    wrap.querySelectorAll('.companion-block').forEach((block)=>{
      const idx = parseInt(block.dataset.idx, 10);
      const nidInput = block.querySelector('.comp-nid-input');
      if(nidInput) nidInput.classList.toggle('invalid', !validateNationalId(state.companionNationalIds[idx] || ''));
    });
    const namesErr = wrap.querySelector('#err-comp-names');
    if(namesErr) namesErr.classList.toggle('show', !namesOk || !fatherNamesOk || !nidsOk);
    if(!namesOk || !fatherNamesOk || !nidsOk) ok = false;
    return ok;
  }
  return true;
}

/** Builds the read-only review shown on the wizard's final step, from live form values. */
function renderReviewSummary(wrap){
  const holder = wrap.querySelector('#review-summary');
  if(!holder) return;
  const specialty = wrap.querySelector('#f-specialty')?.value || '';
  const specialtyOther = wrap.querySelector('#f-specialty-other')?.value.trim() || '';
  const specialtyLabel = specialty === 'other'
    ? (specialtyOther || 'سایر')
    : (getSpecialties().find(s=>s.value===specialty)?.label || '—');

/** Debounced auto-save of text fields to localStorage, restored on next visit. Cleared after successful submit. */
function draftKey(){
  return 'mj-draft-' + (state.currentUser ? state.currentUser.nationalId : 'guest');
}
function setupFormDraft(wrap){
  const fieldIds = ['f-specialty', 'f-specialty-other', 'f-visit-type', 'f-problem-desc',
    'f-appt-from-day', 'f-appt-from-month', 'f-appt-from-year',
    'f-appt-to-day', 'f-appt-to-month', 'f-appt-to-year', 'f-appt-time-slot',
    'f-days', 'f-comp-count', 'f-comp-phone'];
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(draftKey()) || 'null'); }catch(e){}
  if(saved){
    fieldIds.forEach(id=>{
      const el2 = wrap.querySelector('#' + id);
      if(el2 && saved[id]) el2.value = saved[id];
    });
    if(saved['f-specialty'] === 'other'){
      const otherWrap = wrap.querySelector('#other-specialty-wrap');
      if(otherWrap) otherWrap.style.display = 'block';
    }
    showToast('پیش‌نویس قبلی این فرم بازیابی شد');
  }
  let saveTimer = null;
  const doSave = ()=>{
    const data = {};
    fieldIds.forEach(id=>{
      const el2 = wrap.querySelector('#' + id);
      if(el2) data[id] = el2.value;
    });
    try{ localStorage.setItem(draftKey(), JSON.stringify(data)); }catch(e){}
  };
  wrap.querySelectorAll('#' + fieldIds.join(', #')).forEach(el2=>{
    el2.addEventListener('input', ()=>{
      clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, 500);
    });
  });
}
function clearFormDraft(){
  try{ localStorage.removeItem(draftKey()); }catch(e){}
}

function syncCompanionNames(n){
  const names = state.companionNames;
  const fatherNames = state.companionFatherNames;
  const nids = state.companionNationalIds;
  while(names.length < n){ names.push(''); fatherNames.push(''); nids.push(''); }

async function submitForm(wrap){
  const specialty = wrap.querySelector('#f-specialty').value;
  const specialtyOther = wrap.querySelector('#f-specialty-other').value.trim();
  const visitType = wrap.querySelector('#f-visit-type').value;
  const problemDesc = wrap.querySelector('#f-problem-desc').value.trim();
  const apptFromDay = wrap.querySelector('#f-appt-from-day').value;
  const apptFromMonth = wrap.querySelector('#f-appt-from-month').value;
  const apptFromYear = wrap.querySelector('#f-appt-from-year').value;
  const apptToDay = wrap.querySelector('#f-appt-to-day').value;
  const apptToMonth = wrap.querySelector('#f-appt-to-month').value;
  const apptToYear = wrap.querySelector('#f-appt-to-year').value;
  const apptTimeSlot = wrap.querySelector('#f-appt-time-slot').value;
  const needsAccommodation = wrap.querySelector('#f-needs-accommodation').checked;
  const days = wrap.querySelector('#f-days').value.trim();
  const compCount = wrap.querySelector('#f-comp-count').value.trim();
  const compPhone = wrap.querySelector('#f-comp-phone').value.trim();
  const companionNames = state.companionNames.map(n => (n || '').trim());
  const receiptAmountRaw = wrap.querySelector('#f-receipt-amount').value.replace(/[^\d]/g, '');

  let valid = true;
  const setErr = (id, show)=>{
    const inputId = '#f-' + id;
    const input = wrap.querySelector(inputId);
    const err = wrap.querySelector('#err-'+id);
    if(input) input.classList.toggle('invalid', show);
    if(err) err.classList.toggle('show', show);
  };

  if(!specialty){ setErr('specialty', true); valid = false; } else setErr('specialty', false);
  if(!visitType){ setErr('visit-type', true); valid = false; } else setErr('visit-type', false);
  if(!problemDesc){ setErr('problem-desc', true); valid = false; } else setErr('problem-desc', false);
  if(!validateApptRange(wrap)){ setErr('appt-range', true); valid = false; } else setErr('appt-range', false);

  if(needsAccommodation){
    if(!days || !/^\d+$/.test(days)){ setErr('days', true); valid = false; } else setErr('days', false);
    if(!compCount || !/^\d+$/.test(compCount) || parseInt(compCount,10) < 1){ setErr('comp-count', true); valid = false; } else setErr('comp-count', false);
    if(!/^0\d{10}$/.test(compPhone) || compPhone === state.currentUser?.phone){ setErr('comp-phone', true); valid = false; } else setErr('comp-phone', false);
    const namesOk = companionNames.length > 0 && companionNames.every(n => n.length > 0);
    const fatherNamesOk = state.companionFatherNames.length === companionNames.length && state.companionFatherNames.every(n => (n || '').trim().length > 0);
    const nidsOk = state.companionNationalIds.length === companionNames.length && state.companionNationalIds.every(id => validateNationalId(id || ''));
    wrap.querySelectorAll('.companion-block').forEach((block)=>{
      const idx = parseInt(block.dataset.idx, 10);
      const nidInput = block.querySelector('.comp-nid-input');
      if(nidInput) nidInput.classList.toggle('invalid', !validateNationalId(state.companionNationalIds[idx] || ''));
    });
    const namesErr = wrap.querySelector('#err-comp-names');
    if(namesErr) namesErr.classList.toggle('show', !namesOk || !fatherNamesOk || !nidsOk);
    if(!namesOk || !fatherNamesOk || !nidsOk) valid = false;
  }else{
    setErr('days', false);
    setErr('comp-count', false);
    setErr('comp-phone', false);
    const namesErr = wrap.querySelector('#err-comp-names');
    if(namesErr) namesErr.classList.remove('show');
  }

  if(!valid){
    showToast('لطفاً موارد مشخص‌شده با رنگ قرمز را تکمیل یا اصلاح کنید', 'danger');
    return;
  }

  const btn = wrap.querySelector('#submit-btn');
  btn.disabled = true;
  btn.textContent = 'در حال ثبت...';

  const specialtyLabel = specialty === 'other'
    ? (specialtyOther || 'سایر')
    : (getSpecialties().find(s=>s.value===specialty)?.label || specialty);

  let photoThumb = null;
  if(state.photoData){
    try{ photoThumb = await makeThumbnail(state.photoData); }catch(err){ photoThumb = state.photoData; }
  }

  const visitTypeLabel = VISIT_TYPES.find(v=>v.value===visitType)?.label || visitType;
  const apptDateFrom = `${apptFromYear}/${apptFromMonth}/${apptFromDay}`;
  const apptDateTo = `${apptToYear}/${apptToMonth}/${apptToDay}`;
  const apptTimeSlotLabel = APPOINTMENT_TIME_SLOTS.find(t=>t.value===apptTimeSlot)?.label || apptTimeSlot;

  const fields = {
    specialty, specialtyLabel,
    visitType, visitTypeLabel,
    problemDescription: problemDesc,
    appointmentDateFrom: apptDateFrom, appointmentDateTo: apptDateTo,
    appointmentTimeSlot: apptTimeSlot, appointmentTimeSlotLabel: apptTimeSlotLabel,
    needsAccommodation: needsAccommodation ? '1' : '0',
    accommodationDays: needsAccommodation ? days : '',
    companionCount: needsAccommodation ? compCount : '',
    companionPhone: needsAccommodation ? compPhone : '',
    companionNames: JSON.stringify(needsAccommodation ? companionNames : []),
    companionFatherNames: JSON.stringify(needsAccommodation ? state.companionFatherNames.map(n => (n || '').trim()) : []),
    companionNationalIds: JSON.stringify(needsAccommodation ? state.companionNationalIds : []),
    photoThumb: photoThumb || '',
    photoFull: state.photoData || '',
    medicalDocs: JSON.stringify(state.medicalDocs.map(d => ({ name: d.name, dataUrl: d.dataUrl }))),
    receiptAmount: receiptAmountRaw || '0',
    receiptPhotos: JSON.stringify(state.receiptPhotos),
  };

  try{
    const createRes = await apiCallCsrf('submission_create', fields);
    state.lastSubmittedId = createRes.id || null;
    clearFormDraft();
    state.photoData = null;
    state.medicalDocs = [];
    state.needsAccommodation = false;
    state.companionNames = [];
    state.companionFatherNames = [];
    state.companionNationalIds = [];
    state.receiptPhotos = [];
    state.view = 'success';
    render();
  }catch(err){
    showToast(err.message || 'خطا در ذخیره اطلاعات در سرور', 'danger');
    btn.disabled = false;
    btn.innerHTML = `${ICONS.check} ثبت پرونده`;
  }
}

/** Small canvas-free confetti burst using absolutely-positioned divs; respects reduced-motion. */
function fireConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#1F5C56', '#C9974B', '#4C9089', '#E9D3A6', '#2F7A5C'];
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden;';
  document.body.appendChild(layer);
  for(let i=0; i<28; i++){
    const piece = document.createElement('div');
    const size = 6 + Math.random()*6;
    const left = Math.random()*100;
    const duration = 1.6 + Math.random()*1.2;
    const delay = Math.random()*0.3;
    const color = colors[Math.floor(Math.random()*colors.length)];
    piece.style.cssText = `position:absolute; top:-20px; left:${left}%; width:${size}px; height:${size}px;
      background:${color}; border-radius:${Math.random()>0.5?'50%':'2px'};
      animation:confettiFall ${duration}s ease-in ${delay}s forwards; opacity:.9;`;
    layer.appendChild(piece);
  }
  setTimeout(()=> layer.remove(), 3200);
}

      if(data.needsTotp){
        data = await showTotpPrompt();
        if(!data){ submitBtn.disabled = false; return; } // cancelled
      }
      state.previousLogin = data.previousLogin || null;
      state.currentAdminUsername = user;
      err.classList.remove('show');
      await bootstrap(); // refresh adminRole/settings now that the session is authenticated
      if(data.mustChangePassword){
        showToast('برای امنیت بیشتر، لطفاً رمز پیش‌فرض را همین حالا تغییر دهید', 'danger');
      }
      await enterDashboard();
      if(data.mustChangePassword){
        state.showPwModal = true;
        render();
      }
    }catch(connErr){
      submitBtn.disabled = false;
      err.textContent = connErr.message || 'نام کاربری یا رمز عبور اشتباه است.';
      err.classList.add('show');
    }
  });
  wirePasswordToggles(wrap);
  return wrap;
}

        stale_case_days: wrap.querySelector('#set-stale_case_days').value.trim(),

}

/** Loads the current admin's 2FA status and renders the enable/disable UI into #twofa-body.
 *  Works for any admin role — 2FA is per-account, not gated by super_admin/reviewer. */
async function wireTwoFaSection(wrap){
  const body = wrap.querySelector('#twofa-body');
  if(!body) return;

  function renderDisabledState(){
    body.innerHTML = `
      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:12px;">
        غیرفعال است. با فعال‌سازی، هر بار ورود به پنل ادمین علاوه بر رمز عبور، یک کد ۶ رقمی از اپلیکیشن Authenticator هم لازم می‌شود.
      </div>
      <button type="button" class="btn-outline" id="btn-2fa-start">${ICONS.lock} فعال‌سازی 2FA</button>
    `;
    body.querySelector('#btn-2fa-start').onclick = startSetup;
  }

  function renderEnabledState(){
    body.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--success); margin-bottom:12px;">
        ${ICONS.check} فعال است — ورود شما با کد دو مرحله‌ای محافظت می‌شود.
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;">
        <div class="field" style="margin-bottom:0; flex:1; min-width:160px;">
          <label style="font-size:12px;">برای غیرفعال‌سازی، رمز عبور فعلی را وارد کنید</label>
          <input type="password" id="twofa-disable-password" autocomplete="current-password">
        </div>
        <button type="button" class="btn-outline" id="btn-2fa-disable" style="color:var(--danger);">غیرفعال‌سازی 2FA</button>
      </div>
    `;
    body.querySelector('#btn-2fa-disable').onclick = async ()=>{
      const password = body.querySelector('#twofa-disable-password').value;
      if(!password){ showToast('رمز عبور را وارد کنید', 'danger'); return; }
      try{
        await apiCallCsrf('admin_2fa_disable', { password });
        showToast('احراز هویت دو مرحله‌ای غیرفعال شد');
        renderDisabledState();
      }catch(e){
        showToast(e.message || 'خطا در غیرفعال‌سازی', 'danger');
      }
    };
  }

  async function startSetup(){
    body.innerHTML = `<div class="skeleton-block" style="height:40px;"></div>`;
    try{
      const data = await apiCallCsrf('admin_2fa_setup_start', {});
      const grouped = data.secret.match(/.{1,4}/g).join(' ');
      body.innerHTML = `
        <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">
          این کلید را در اپلیکیشن Authenticator (مثل Google Authenticator یا Authy) به‌صورت دستی وارد کنید — گزینه‌ی «Enter a setup key» یا «ورود دستی».
        </div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <code style="direction:ltr; font-size:15px; letter-spacing:1px; background:var(--bg); padding:10px 14px; border-radius:8px; border:1px solid var(--border); flex:1; text-align:center;">${escapeHtml(grouped)}</code>
          <button type="button" class="pass-toggle-btn" id="btn-2fa-copy" style="position:static; color:var(--primary);" title="کپی">${ICONS.check}</button>
        </div>
        <div class="field field-full">
          <label style="font-size:12px;">کد ۶ رقمی نمایش‌داده‌شده در اپلیکیشن را وارد کنید</label>
          <input type="text" id="twofa-confirm-code" inputmode="numeric" maxlength="6" placeholder="123456" style="text-align:center; letter-spacing:3px; direction:ltr; font-size:16px;">
        </div>
        <button type="button" class="submit-btn" id="btn-2fa-confirm" style="width:auto; padding:0 20px;">${ICONS.check} تایید و فعال‌سازی</button>
      `;
      body.querySelector('#btn-2fa-copy').onclick = async ()=>{
        try{ await navigator.clipboard.writeText(data.secret); showToast('کلید کپی شد'); }catch(e){}
      };
      body.querySelector('#btn-2fa-confirm').onclick = async ()=>{
        const code = body.querySelector('#twofa-confirm-code').value.trim();
        if(!/^\d{6}$/.test(code)){ showToast('کد باید ۶ رقم باشد', 'danger'); return; }
        try{
          await apiCallCsrf('admin_2fa_setup_confirm', { code });
          showToast('احراز هویت دو مرحله‌ای فعال شد');
          renderEnabledState();
        }catch(e){
          showToast(e.message || 'کد نامعتبر است', 'danger');
        }
      };
    }catch(e){
      showToast(e.message || 'خطا در شروع فعال‌سازی', 'danger');
      renderDisabledState();
    }
  }

  try{
    const status = await apiCall('admin_2fa_status', {});
    if(status.enabled) renderEnabledState(); else renderDisabledState();
  }catch(e){
    body.innerHTML = `<div style="font-size:12.5px; color:var(--danger);">خطا در دریافت وضعیت 2FA</div>`;
  }
}

    <tr data-username="${escapeHtml(a.username)}">
      <td>${escapeHtml(a.username)}</td>
      <td>
        <select class="admin-role-select" ${a.username === currentAdminUsername() ? 'disabled title="نمی‌توانید نقش خودتان را اینجا تغییر دهید"' : ''}>
          <option value="super_admin" ${a.role==='super_admin'?'selected':''}>مدیر ارشد</option>

      </td>
      <td style="font-size:12px; color:var(--text-muted);">${a.last_login_at ? timeAgoFa(a.last_login_at) : 'هنوز وارد نشده'}</td>
      <td><button type="button" class="pass-toggle-btn admin-delete-btn" style="position:static; color:var(--danger);" aria-label="حذف حساب">${ICONS.trash}</button></td>
    </tr>
  `).join('');

  return `<div class="card" style="margin-bottom:20px;">
    <h3 style="margin-top:0;">${ICONS.users} حساب‌های مدیر و نقش‌ها</h3>
    <div class="table-card" style="box-shadow:none; border:1px solid var(--border);">
      <table>
        <thead><tr><th>نام کاربری</th><th>نقش</th><th>آخرین ورود</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:16px; padding-top:16px; border-top:1px dashed var(--border);">
      <div class="field" style="margin-bottom:0; flex:1; min-width:140px;"><label style="font-size:12px;">نام کاربری جدید</label><input type="text" id="new-admin-username" autocomplete="off" style="direction:ltr;"></div>
      <div class="field" style="margin-bottom:0; flex:1; min-width:140px;"><label style="font-size:12px;">رمز عبور</label><input type="password" id="new-admin-password" autocomplete="new-password"></div>
      <div class="field" style="margin-bottom:0; flex:1; min-width:140px;"><label style="font-size:12px;">نقش</label>
        <select id="new-admin-role"><option value="reviewer">بررسی‌کننده</option><option value="super_admin">مدیر ارشد</option></select>
      </div>
      <button type="button" class="submit-btn" id="btn-create-admin" style="width:auto; padding:0 16px;">${ICONS.check} افزودن</button>
    </div>
  </div>`;
}

function wireAdminManagement(wrap){
  wrap.querySelectorAll('.admin-role-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const username = sel.closest('tr').dataset.username;
      sel.disabled = true;
      try{
        await apiCallCsrf('admin_set_role', { username, role: sel.value });
        showToast('نقش بروزرسانی شد');
        await loadSettingsData();
      }catch(e){
        showToast(e.message || 'خطا در تغییر نقش', 'danger');
        sel.disabled = false;
      }
    });
  });
  wrap.querySelectorAll('.admin-delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.closest('tr').dataset.username;
      if(username === currentAdminUsername()){ showToast('نمی‌توانید حساب خودتان را حذف کنید', 'danger'); return; }
      if(!confirm(`حساب مدیر «${username}» حذف شود؟`)) return;
      try{
        await apiCallCsrf('admin_delete', { username });
        showToast('حساب حذف شد');
        await loadSettingsData();
      }catch(e){
        showToast(e.message || 'خطا در حذف حساب', 'danger');
      }
    });
  });
  const createBtn = wrap.querySelector('#btn-create-admin');
  if(createBtn){
    createBtn.onclick = async ()=>{
      const username = wrap.querySelector('#new-admin-username').value.trim();
      const password = wrap.querySelector('#new-admin-password').value;
      const role = wrap.querySelector('#new-admin-role').value;
      if(!username || !password){ showToast('نام کاربری و رمز عبور را وارد کنید', 'danger'); return; }
      createBtn.disabled = true;
      try{
        await apiCallCsrf('admin_create', { username, password, role });
        showToast('حساب مدیر جدید ایجاد شد');
        await loadSettingsData();
      }catch(e){
        showToast(e.message || 'خطا در ایجاد حساب', 'danger');
      }finally{
        createBtn.disabled = false;
      }
    };
  }
}

/** Best-effort username of the currently logged-in admin, for self-protection checks in the UI. */
function currentAdminUsername(){
  return state.currentAdminUsername || null;
}

/** Client-side smart search across donor name and phone (matches the pattern
 *  used for the مددجو list search), so admins can quickly find a donor. */
function filteredDonorList(){
  const q = (state.donorSearch || '').trim();
  if(!q) return state.donorList;
  const norm = s => (s || '').toString().toLowerCase();
  const nq = norm(q);
  return state.donorList.filter(d => norm(d.name).includes(nq) || norm(d.phone).includes(nq) || norm(d.email).includes(nq));
}

      <h3 style="clear:both;">یکی‌کردن خیرین تکراری</h3>

  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  overlay.querySelector('#donor-merge-form').addEventListener('submit', async (e)=>{

    if(!mergeId || !keepId){ showToast('لطفاً هر دو خیر را انتخاب کنید', 'danger'); return; }

    }
  });

/** Builds a clean, bordered, print-only <table> of the (currently filtered)
 *  donor list into #donor-print-table-holder right before printing. */
function buildDonorPrintTable(wrap){
  const holder = wrap.querySelector('#donor-print-table-holder');
  if(!holder) return;
  const list = filteredDonorList();
  holder.innerHTML = `
    <table>
      <thead><tr>
        <th>نام خیر</th><th>نوع</th><th>شماره موبایل</th><th>کد ملی</th>
        <th>مجموع کمک‌ها</th><th>تعداد کمک</th><th>آخرین کمک</th>
      </tr></thead>
      <tbody>
        ${list.map(d => `<tr>
          <td>${escapeHtml(d.name)}</td>
          <td>${DONOR_TYPE_LABELS_FA[d.donor_type] || 'حقیقی'}</td>
          <td>${escapeHtml(d.phone || '—')}</td>
          <td>${escapeHtml(d.national_id || '—')}</td>
          <td>${formatToman(d.total_donated)}</td>
          <td>${d.donation_count}</td>
          <td>${d.last_donation_date ? gregorianStrToJalaliLabel(d.last_donation_date) : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

/** Excel export of the (currently filtered) donor list — freeze pane +
 *  autofilter + per-column widths, matching the accounting/dashboard exports. */
function exportDonorsExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('کتابخانه‌ی ساخت اکسل هنوز بارگذاری نشده؛ چند ثانیه صبر کنید و دوباره امتحان کنید.', 'danger');
    return;
  }
  const list = filteredDonorList();
  const headers = ['نام خیر', 'نوع', 'شماره موبایل', 'کد ملی', 'ایمیل', 'مجموع کمک‌ها (تومان)', 'تعداد کمک', 'آخرین کمک', 'یادداشت'];
  const rows = list.map(d => [
    d.name,
    DONOR_TYPE_LABELS_FA[d.donor_type] || 'حقیقی',
    d.phone || '',
    d.national_id || '',
    d.email || '',
    d.total_donated,
    d.donation_count,
    d.last_donation_date ? gregorianStrToJalaliLabel(d.last_donation_date) : '',
    d.notes || '',
  ]);
  const sheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  sheet['!cols'] = [{ wch: 24 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 22 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 30 }];
  sheet['!views'] = [{ rightToLeft: true }];
  sheet['!freeze'] = { xSplit: 0, ySplit: 1 };
  sheet['!autofilter'] = { ref: `A1:${XLSX.utils.encode_col(headers.length - 1)}${rows.length + 1}` };
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, sheet, 'خیرین');
  XLSX.writeFile(workbook, `گزارش_خیرین_موسسه.xlsx`);
}

function renderDonorListHolder(wrap){
  const holder = wrap.querySelector('#donor-list-holder');
  const list = filteredDonorList();
  if(state.loadingSubs){
    holder.innerHTML = Array.from({length:4}).map(()=>`<div class="skeleton-row"><div class="skeleton-block" style="width:70%; height:14px;"></div></div>`).join('');
  }else if(state.donorList.length === 0){
    holder.innerHTML = `<div class="empty-state">${ICONS.users}<div>هنوز خیری ثبت نشده است.</div></div>`;
  }else if(list.length === 0){
    holder.innerHTML = `<div class="empty-state">${ICONS.users}<div>خیری مطابق با جستجوی شما یافت نشد.</div></div>`;
  }else{
    holder.innerHTML = list.map(d => `
      <div class="acct-tx-row donor-row" data-id="${d.id}" style="grid-template-columns:1fr 130px 130px 110px; cursor:pointer;">
        <span>
          <div style="font-weight:700;">${escapeHtml(d.name)} ${d.donor_type === 'company' ? '<span style="font-weight:400; font-size:10.5px; color:var(--text-muted); border:1px solid var(--border); border-radius:6px; padding:1px 5px;">حقوقی</span>' : ''}</div>
          <div style="color:var(--text-muted); font-size:11px;">${d.phone ? escapeHtml(d.phone) : 'بدون شماره موبایل'}</div>
        </span>
        <span class="acct-tx-amount income">${formatToman(d.total_donated)}</span>
        <span style="font-size:11.5px; color:var(--text-muted);">${d.donation_count} کمک مالی</span>
        <span style="font-size:11px; color:var(--text-muted);">${d.last_donation_date ? gregorianStrToJalaliLabel(d.last_donation_date) : '—'}</span>
      </div>
    `).join('');
    holder.querySelectorAll('.donor-row').forEach(row=>{
      row.addEventListener('click', ()=> openDonorDetail(row.dataset.id));
    });
  }
}

/** Builds and prints a formal donation-summary receipt for one donor,
 *  reusing the existing "printing-record" print mode (hides everything
 *  except the printed modal itself). */
function printDonorReceipt(d){
  const total = d.transactions.reduce((s,t)=>s+t.amount,0);
  const todayLabel = gregorianStrToJalaliLabel(new Date().toISOString().slice(0,10));
  const overlay = el(`<div class="modal-overlay" id="donor-receipt-print-overlay">
    <div class="modal" style="max-width:640px;">
      <div class="print-report-header" style="display:block; text-align:center; margin-bottom:18px;">
        <h2>گواهی کمک‌های مالی</h2>
        <p>موسسه خیریه درمانی مهر جاوید</p>
      </div>
      <div class="detail-row"><span class="k">نام خیر</span><span class="v">${escapeHtml(d.donor.name)}</span></div>
      ${d.donor.national_id ? `<div class="detail-row"><span class="k">کد ملی</span><span class="v">${escapeHtml(d.donor.national_id)}</span></div>` : ''}
      <div class="detail-row"><span class="k">نوع خیر</span><span class="v">${DONOR_TYPE_LABELS_FA[d.donor.donor_type] || 'حقیقی'}</span></div>
      <div class="detail-row"><span class="k">تاریخ صدور گواهی</span><span class="v">${todayLabel}</span></div>
      <div class="detail-row"><span class="k">مجموع کل کمک‌های مالی</span><span class="v" style="color:var(--success); font-weight:700;">${formatToman(total)}</span></div>
      <div style="font-size:12.5px; color:var(--text-muted); margin:6px 0 14px;">${numberToPersianWords(total)} تومان</div>
      <h4 style="margin-top:18px;">ریز کمک‌های مالی</h4>
      ${d.transactions.length ? `<table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr style="border-bottom:1px solid var(--border);"><th style="text-align:right; padding:6px 4px;">تاریخ</th><th style="text-align:right; padding:6px 4px;">مبلغ</th><th style="text-align:right; padding:6px 4px;">توضیحات</th></tr></thead>
        <tbody>
          ${d.transactions.map(t => `<tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 4px;">${gregorianStrToJalaliLabel(t.transaction_date)}</td><td style="padding:6px 4px;">${formatToman(t.amount)}</td><td style="padding:6px 4px;">${escapeHtml(t.description || t.category_name || '—')}</td></tr>`).join('')}
        </tbody>
      </table>` : `<div class="msg-empty">کمکی ثبت نشده است.</div>`}

        <span>مهر و امضای موسسه</span>
        <span>—————————————</span>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  document.body.classList.add('printing-record');
  const cleanup = ()=>{ document.body.classList.remove('printing-record'); overlay.remove(); };
  window.addEventListener('afterprint', cleanup, { once: true });
  setTimeout(()=>{ window.print(); setTimeout(cleanup, 500); }, 300);
}

async function openDonorDetail(id){
  state.donorDetailId = id;
  state.donorDetailData = null;
  state.donorEditMode = false;
  render();
  try{
    state.donorDetailData = await apiCall('donor_detail', { id });
  }catch(e){
    showToast(e.message || 'خطا در دریافت اطلاعات خیر', 'danger');
    state.donorDetailId = null;
  }
  render();
}

function renderDonorDetailModal(){

async function loadFinancialSummary(){
  try{
    state.financialSummary = await apiCall('financial_summary', {});
  }catch(e){
    state.financialSummary = null;
  }
}

async function loadAccountingData(){
  state.loadingSubs = true;
  render();
  try{
    const rangeParams = state.acctRange ? { startDate: state.acctRange.startDate, endDate: state.acctRange.endDate } : {};
    const filterParams = {
      q: state.acctFilters.q || '',
      categoryId: state.acctFilters.categoryId || '',
      minAmount: state.acctFilters.minAmount || '',
      maxAmount: state.acctFilters.maxAmount || '',
    };
    const [catData, bankData, txData, summaryData, donorData] = await Promise.all([
      apiCall('accounting_category_list', {}),
      apiCall('accounting_bank_account_list', {}),
      apiCall('accounting_transaction_list', { ...rangeParams, ...filterParams }),
      apiCall('accounting_summary', rangeParams),
      apiCall('donor_list', {}),
    ]);
    state.acctCategories = catData.items || [];
    state.acctBankAccounts = bankData.items || [];
    state.acctTransactions = txData.items || [];
    state.acctSummary = summaryData;
    state.donorList = donorData.items || [];
  }catch(e){
    showToast(e.message || 'خطا در دریافت اطلاعات حسابداری', 'danger');
  }
  state.loadingSubs = false;
  render();
}

  // Live budget check: as soon as an expense category + amount are set, show
  // how much of that category's budget for the current month is already
  // used — so overspending is visible right when entering the transaction,
  // not only later in the separate «بودجه» report.
  const budgetWarningBox = wrap.querySelector('#acct-budget-warning');
  const categorySelect = wrap.querySelector('#acct-category');
  const amountInputForBudget = wrap.querySelector('#acct-amount');
  if(budgetWarningBox && categorySelect && state.acctFormType === 'expense'){
    const checkBudget = async ()=>{
      const catId = categorySelect.value;
      const newAmount = parseInt((amountInputForBudget.value || '').replace(/[^\d]/g, ''), 10) || 0;
      if(!catId){ budgetWarningBox.style.display = 'none'; return; }
      const now = new Date();
      const periodValue = todayG.slice(0, 7); // "YYYY-MM" from the Gregorian today string already computed above
      try{
        const data = await apiCall('budget_vs_actual', { periodType: 'monthly', periodValue });
        const row = (data.items || []).find(it => String(it.category_id) === String(catId));
        if(!row || !row.budget_amount){ budgetWarningBox.style.display = 'none'; return; }
        const usedAfter = (row.actual_amount || 0) + newAmount;
        const pct = Math.round((usedAfter / row.budget_amount) * 100);
        const over = usedAfter > row.budget_amount;
        budgetWarningBox.style.display = 'block';
        budgetWarningBox.innerHTML = `
          <div class="field field-full" style="background:${over ? 'var(--danger-bg)' : 'rgba(201,162,39,0.12)'}; border:1px solid ${over ? 'var(--danger)' : '#C9A227'}; border-radius:8px; padding:10px 12px; font-size:12px; color:${over ? 'var(--danger)' : '#8a6d1a'};">
            ${over ? '⚠️ این تراکنش از بودجه‌ی این دسته در این ماه عبور می‌کند' : 'ℹ️ وضعیت بودجه‌ی این دسته'} — با احتساب این تراکنش: ${formatToman(usedAfter)} از ${formatToman(row.budget_amount)} (${pct}%)
          </div>`;
      }catch(e){
        budgetWarningBox.style.display = 'none';
      }
    };
    categorySelect.addEventListener('change', checkBudget);
    amountInputForBudget.addEventListener('blur', checkBudget);
  }

  // Receipt upload
  const receiptBox = wrap.querySelector('#acct-receipt-box');
  const receiptInput = wrap.querySelector('#acct-receipt-input');
  function renderAcctReceiptPreview(){
    if(!receiptBox) return;
    receiptBox.innerHTML = '';
    if(state.acctReceiptPhoto){
      receiptBox.classList.add('has-image');
      const pw = el(`<div class="preview-wrap"><img src="${state.acctReceiptPhoto}" style="cursor:zoom-in;"><button type="button" class="preview-remove">حذف عکس</button></div>`);
      receiptBox.appendChild(pw);
      pw.querySelector('img').addEventListener('click', (e)=>{ e.stopPropagation(); openLightbox(state.acctReceiptPhoto); });
      pw.querySelector('.preview-remove').onclick = (e)=>{ e.stopPropagation(); state.acctReceiptPhoto = null; receiptInput.value=''; renderAcctReceiptPreview(); };
    }else{
      receiptBox.classList.remove('has-image');
      receiptBox.appendChild(receiptInput);
      receiptBox.appendChild(el(`<div class="upload-placeholder">${ICONS.upload}<span>برای آپلود عکس رسید کلیک کنید</span></div>`));
    }
  }
  if(receiptBox && receiptInput){
    receiptBox.addEventListener('click', (e)=>{ if(e.target.closest('.preview-remove')) return; receiptInput.click(); });
    receiptInput.addEventListener('change', async ()=>{
      const file = receiptInput.files[0];
      if(!file) return;
      const err = validateUploadFile(file, ['image/']);
      if(err){ showToast(err, 'danger'); receiptInput.value=''; return; }
      try{ state.acctReceiptPhoto = await readFileAsDataUrl(file); renderAcctReceiptPreview(); }

  const donorInput = wrap.querySelector('#acct-donor');
  const donorIdInput = wrap.querySelector('#acct-donor-id');
  const donorSuggestBox = wrap.querySelector('#acct-donor-suggestions');
  if(donorInput){
    const renderDonorSuggestions = ()=>{
      const q = donorInput.value.trim().toLowerCase();
      donorIdInput.value = '';
      if(!q){ donorSuggestBox.style.display = 'none'; donorSuggestBox.innerHTML = ''; return; }
      const matches = state.donorList.filter(d => (d.name || '').toLowerCase().includes(q) || (d.phone || '').includes(q)).slice(0, 8);
      if(matches.length === 0){ donorSuggestBox.style.display = 'none'; donorSuggestBox.innerHTML = ''; return; }
      donorSuggestBox.innerHTML = matches.map(d => `
        <div class="suggest-item" data-id="${d.id}" data-name="${escapeHtml(d.name)}">
          <div>${escapeHtml(d.name)}</div>
          <div class="sub">${d.phone ? escapeHtml(d.phone) : 'بدون شماره موبایل'} · مجموع کمک: ${formatToman(d.total_donated)}</div>
        </div>
      `).join('');
      donorSuggestBox.style.display = 'block';
      donorSuggestBox.querySelectorAll('.suggest-item').forEach(item=>{
        item.addEventListener('click', ()=>{
          donorInput.value = item.dataset.name;
          donorIdInput.value = item.dataset.id;
          donorSuggestBox.style.display = 'none';
        });
      });
    };
    donorInput.addEventListener('input', renderDonorSuggestions);
    donorInput.addEventListener('focus', renderDonorSuggestions);
    document.addEventListener('click', (e)=>{ if(!donorInput.contains(e.target) && !donorSuggestBox.contains(e.target)) donorSuggestBox.style.display = 'none'; });

      clearTimeout(debounceTimer);
      const q = beneficiaryInput.value.trim();
      if(q.length < 2){ beneficiarySuggestBox.style.display = 'none'; beneficiarySuggestBox.innerHTML = ''; return; }
      debounceTimer = setTimeout(async ()=>{
        try{
          const data = await apiCall('submission_search', { q });

          if(items.length === 0){
            beneficiarySuggestBox.innerHTML = `<div class="suggest-item" style="cursor:default; color:var(--text-muted);">موردی یافت نشد</div>`;

    if(!amount || amount <= 0){ showToast('لطفاً مبلغ معتبری وارد کنید', 'danger'); return; }

    if(state.acctFormType === 'transfer'){
      const fromAccountId = wrap.querySelector('#acct-transfer-from').value;
      const toAccountId = wrap.querySelector('#acct-transfer-to').value;
      if(!fromAccountId || !toAccountId){ showToast('لطفاً هر دو حساب مبدأ و مقصد را انتخاب کنید', 'danger'); return; }
      if(fromAccountId === toAccountId){ showToast('حساب مبدأ و مقصد نمی‌توانند یکی باشند', 'danger'); return; }
      btn.disabled = true;
      try{
        await apiCallCsrf('accounting_transfer_create', {
          fromAccountId, toAccountId, amount,
          description: wrap.querySelector('#acct-description').value.trim(),
          transactionDate: txDateBtn.dataset.g,
        });
        showToast('انتقال بین حساب‌ها ثبت شد');
        await loadAccountingData();
      }catch(err){
        btn.disabled = false;
        showToast(err.message || 'خطا در ثبت انتقال وجه', 'danger');

      return;
    }

    const categoryId = wrap.querySelector('#acct-category').value;
    if(!categoryId){ showToast('لطفاً دسته‌بندی را انتخاب کنید', 'danger'); return; }
    const bankAccountId = wrap.querySelector('#acct-bank-account').value;
    if(!bankAccountId){ showToast('لطفاً حساب / صندوق را انتخاب کنید', 'danger'); return; }
    const paymentMethod = wrap.querySelector('#acct-payment-method').value;
    if(paymentMethod === 'cheque' && !chequeDueDateBtn?.dataset.g){ showToast('لطفاً تاریخ سررسید چک را انتخاب کنید', 'danger'); return; }
    btn.disabled = true;
    try{
      const result = await apiCallCsrf('accounting_transaction_create', {
        type: state.acctFormType,
        categoryId,
        bankAccountId,
        amount,
        description: wrap.querySelector('#acct-description').value.trim(),
        transactionDate: txDateBtn.dataset.g,
        paymentMethod,
        chequeNumber: paymentMethod === 'cheque' ? wrap.querySelector('#acct-cheque-number').value.trim() : '',
        chequeDueDate: paymentMethod === 'cheque' ? (chequeDueDateBtn?.dataset.g || '') : '',
        donorName: state.acctFormType === 'income' ? (wrap.querySelector('#acct-donor')?.value.trim() || '') : '',
        relatedSubmissionId: (state.acctFormType === 'expense' && state.acctSelectedBeneficiary) ? state.acctSelectedBeneficiary.id : '',
        receiptPhoto: state.acctReceiptPhoto || '',
      });
      state.acctReceiptPhoto = null;
      const wasLinked = state.acctFormType === 'expense' && state.acctSelectedBeneficiary;
      state.acctSelectedBeneficiary = null;
      showToast(wasLinked && result.linkedPaymentStatus ? 'تراکنش ثبت شد و در پروفایل مددجو نیز درج شد' : 'تراکنش ثبت شد');
      await loadAccountingData();
    }catch(err){
      btn.disabled = false;
      showToast(err.message || 'خطا در ثبت تراکنش', 'danger');
    }
  });

  buildAcctTxList(wrap);
  const budgetDayBtn = wrap.querySelector('#budget-period-day');
  budgetDayBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    openJalaliCalendarPopup(budgetDayBtn, budgetDayBtn.dataset.g, (g)=>{ budgetDayBtn.dataset.g = g; budgetDayBtn.textContent = gregorianStrToJalaliLabel(g); });
  });
  wrap.querySelector('#budget-load-btn').onclick = async ()=>{
    const periodType = wrap.querySelector('#budget-period-type').value;
    const gDate = budgetDayBtn.dataset.g; // YYYY-MM-DD (Gregorian)
    const periodValue = periodType === 'monthly' ? gDate.slice(0, 7) : gDate.slice(0, 4);
    state.budgetPeriodType = periodType;
    state.budgetPeriodValue = periodValue;
    await loadBudgetVsActual(wrap);
  };
  if(state.budgetPeriodValue) loadBudgetVsActual(wrap);
  wrap.querySelector('#acct-btn-export-excel').onclick = () => exportAccountingExcel();
  wrap.querySelector('#acct-btn-export-word').onclick = () => exportAccountingWord();
  wrap.querySelector('#acct-btn-export-pdf').onclick = () => {
    buildAcctPrintTable(wrap);
    showToast('پنجره چاپ باز شد؛ در آن «ذخیره به‌صورت PDF» را انتخاب کنید');
    document.body.classList.add('printing-list');
    const cleanup = ()=> document.body.classList.remove('printing-list');
    window.addEventListener('afterprint', cleanup, { once: true });
    setTimeout(()=>{ window.print(); setTimeout(cleanup, 500); }, 300);
  };

  return wrap;
}

async function loadBudgetVsActual(wrap){
  const holder = wrap.querySelector('#budget-table-holder');
  holder.innerHTML = `<div class="skeleton-block" style="height:60px;"></div>`;
  try{
    const data = await apiCall('budget_vs_actual', { periodType: state.budgetPeriodType, periodValue: state.budgetPeriodValue });
    state.budgetData = data.items || [];
  }catch(e){
    showToast(e.message || 'خطا در دریافت اطلاعات بودجه', 'danger');
    state.budgetData = [];
  }
  renderBudgetTable(wrap);
}

function renderBudgetTable(wrap){
  const holder = wrap.querySelector('#budget-table-holder');
  if(!state.budgetData.length){
    holder.innerHTML = `<div class="msg-empty">داده‌ای برای نمایش نیست.</div>`;
    return;
  }
  holder.innerHTML = state.budgetData.map(b => {
    const pct = b.budget_amount > 0 ? Math.round((b.actual_amount / b.budget_amount) * 100) : (b.actual_amount > 0 ? 100 : 0);
    const over = b.budget_amount > 0 && b.actual_amount > b.budget_amount;
    return `
      <div class="breakdown-row" data-cat="${b.category_id}">
        <span class="name">${escapeHtml(b.category_name)}</span>
        <span class="track"><span class="fill" style="width:${Math.min(100, pct)}%; background:${over ? 'var(--danger)' : 'var(--success)'};"></span></span>
        <span class="n" style="white-space:nowrap;">${formatToman(b.actual_amount)} / ${b.budget_amount > 0 ? formatToman(b.budget_amount) : 'بدون بودجه'}</span>
        <button type="button" class="link-btn budget-edit-btn" data-cat="${b.category_id}" style="font-size:11px; margin-right:8px;">ویرایش بودجه</button>
      </div>
    `;
  }).join('');
  holder.querySelectorAll('.budget-edit-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const catId = btn.dataset.cat;
      const current = state.budgetData.find(b => String(b.category_id) === catId);
      const raw = prompt(`مبلغ بودجه برای «${current.category_name}» (تومان):`, current.budget_amount || '');
      if(raw === null) return;
      const amount = parseInt(raw.replace(/[^\d]/g, ''), 10) || 0;
      try{
        await apiCallCsrf('budget_set', { categoryId: catId, periodType: state.budgetPeriodType, periodValue: state.budgetPeriodValue, amount });
        showToast('بودجه ثبت شد');
        await loadBudgetVsActual(wrap);
      }catch(err){
        showToast(err.message || 'خطا در ثبت بودجه', 'danger');
      }
    });
  });
}

    holder.innerHTML = Array.from({length:4}).map(()=>`<div class="skeleton-row"><div class="skeleton-block" style="width:70%; height:14px;"></div></div>`).join('');
    return;
  }
  if(state.acctTransactions.length === 0){
    holder.innerHTML = `<div class="empty-state">${ICONS.inbox}<div>هنوز تراکنشی ثبت نشده است.</div></div>`;
    return;
  }
  holder.innerHTML = `
    <div class="acct-tx-row" style="font-weight:700; color:var(--text-muted); font-size:11px;">
      <span>تاریخ</span><span>توضیحات / دسته</span><span>روش پرداخت</span><span>مبلغ</span><span></span>
    </div>
    ${state.acctTransactions.map(t => `
      <div class="acct-tx-row" data-id="${t.id}">
        <span>${gregorianStrToJalaliLabel(t.transaction_date)}</span>
        <span>
          <div style="font-weight:600;">
            ${t.is_transfer ? `<span style="color:var(--primary-dark);">🔄 انتقال بین حساب‌ها</span>` : escapeHtml(t.category_name || 'بدون دسته')}
            <span style="font-weight:400; color:var(--text-muted); font-size:11px;">(${escapeHtml(t.bank_account_name || 'بدون حساب')})</span>
          </div>
          <div style="color:var(--text-muted); font-size:11px;">${escapeHtml(t.description || '')}${t.donor_name ? ' — ' + escapeHtml(t.donor_name) : ''}${t.related_submission_name ? ` — <span style="color:var(--accent); font-weight:600;">مددجو: ${escapeHtml(t.related_submission_name)}</span>` : ''}${t.cheque_due_date ? ` — <span style="color:#C9A227; font-weight:600;">سررسید چک: ${gregorianStrToJalaliLabel(t.cheque_due_date)}${t.cheque_number ? ' (شماره ' + escapeHtml(t.cheque_number) + ')' : ''}</span>` : ''}</div>
        </span>
        <span>${PAYMENT_METHOD_LABELS_FA[t.payment_method] || t.payment_method}</span>
        <span class="acct-tx-amount ${t.type}">${t.type === 'income' ? '+' : '−'}${formatToman(t.amount)}</span>
        <span style="display:flex; gap:4px;">
          ${t.has_receipt ? `<button type="button" class="pass-toggle-btn acct-view-receipt" data-id="${t.id}" title="مشاهده رسید" style="position:static; color:var(--primary);">${ICONS.eye}</button>` : ''}
          ${t.is_transfer ? '' : `<button type="button" class="pass-toggle-btn acct-edit-tx" data-id="${t.id}" title="ویرایش" style="position:static; color:var(--primary);">${ICONS.check}</button>`}
          <button type="button" class="pass-toggle-btn acct-delete-tx" data-id="${t.id}" title="${t.is_transfer ? 'حذف (هر دو طرف انتقال حذف می‌شود)' : 'حذف'}" style="position:static; color:var(--danger);">×</button>
        </span>
      </div>
    `).join('')}
  `;
  holder.querySelectorAll('.acct-edit-tx').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tx = state.acctTransactions.find(x => String(x.id) === String(btn.dataset.id));
      if(!tx) return;
      state.acctEditingTx = { ...tx };
      render();
    });
  });
  holder.querySelectorAll('.acct-delete-tx').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('آیا از حذف این تراکنش مطمئن هستید؟')) return;
      try{
        await apiCallCsrf('accounting_transaction_delete', { id: btn.dataset.id });
        showToast('تراکنش حذف شد');
        await loadAccountingData();
      }catch(err){
        showToast(err.message || 'خطا در حذف تراکنش', 'danger');
      }
    });
  });
  holder.querySelectorAll('.acct-view-receipt').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      try{
        const data = await apiCall('accounting_asset', { id: btn.dataset.id });
        openLightbox(data.dataUrl);
      }catch(err){
        showToast(err.message || 'خطا در دریافت رسید', 'danger');
      }
    });
  });
}

  return overlay;

/** Builds a genuine, properly-typed <table> (real thead/tbody, borders,
 *  repeating headers, no mid-row page breaks) into #acct-print-table-holder
 *  right before printing — the on-screen list is a CSS grid that prints
 *  messily, so this is a dedicated print-only rendering. */
function buildAcctPrintTable(wrap){
  const holder = wrap.querySelector('#acct-print-table-holder');
  if(!holder) return;
  const s = state.acctSummary;

  const summaryRow = (label, value) => `<tr><th style="width:220px;">${escapeHtml(label)}</th><td>${escapeHtml(String(value ?? '—'))}</td></tr>`;
  const summaryHtml = s ? `
    <h3>خلاصه</h3>
    <table>
      ${summaryRow('کل درآمد', formatToman(s.totalIncome))}
      ${summaryRow('کل هزینه', formatToman(s.totalExpense))}
      ${summaryRow('مانده‌ی خالص', formatToman(s.netBalance))}
      ${summaryRow('هزینه‌های عملیاتی موسسه', formatToman(s.institutionalExpense || 0))}
      ${summaryRow('پرداختی به مددجویان', formatToman(s.beneficiaryPayments || 0) + ` (${s.beneficiaryPaymentsCount || 0} پرداخت)`)}
    </table>` : '';

  const catHtml = (s && s.byCategory && s.byCategory.length) ? `
    <h3>تفکیک بر اساس دسته‌بندی</h3>
    <table>
      <thead><tr><th>دسته‌بندی</th><th>نوع</th><th>مبلغ</th></tr></thead>
      <tbody>
        ${s.byCategory.map(c => `<tr><td>${escapeHtml(c.category || 'بدون دسته')}</td><td>${c.type === 'income' ? 'درآمد' : 'هزینه'}</td><td>${formatToman(c.total)}</td></tr>`).join('')}
      </tbody>
    </table>` : '';

  const txHtml = `
    <h3>فهرست کامل تراکنش‌ها</h3>
    <table>
      <thead><tr>
        <th>تاریخ</th><th>نوع</th><th>دسته‌بندی</th><th>حساب/صندوق</th><th>مبلغ</th><th>توضیحات</th><th>روش پرداخت</th>
      </tr></thead>
      <tbody>
        ${state.acctTransactions.map(t => `<tr>
          <td>${gregorianStrToJalaliLabel(t.transaction_date)}</td>
          <td>${t.is_transfer ? 'انتقال' : (t.type === 'income' ? 'درآمد' : 'هزینه')}</td>
          <td>${escapeHtml(t.category_name || '—')}</td>
          <td>${escapeHtml(t.bank_account_name || '—')}</td>
          <td>${formatToman(t.amount)}</td>
          <td>${escapeHtml(t.description || '—')}${t.donor_name ? ' — ' + escapeHtml(t.donor_name) : ''}${t.related_submission_name ? ' — مددجو: ' + escapeHtml(t.related_submission_name) : ''}</td>
          <td>${PAYMENT_METHOD_LABELS_FA[t.payment_method] || t.payment_method}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  holder.innerHTML = summaryHtml + catHtml + txHtml;
}

function exportAccountingExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('کتابخانه‌ی ساخت اکسل هنوز بارگذاری نشده؛ چند ثانیه صبر کنید و دوباره امتحان کنید.', 'danger');
    return;
  }
  const s = state.acctSummary;
  const workbook = XLSX.utils.book_new();

  // Sheet 1 — خلاصه: totals + category breakdown, kept separate from the
  // raw transaction rows so opening the file gives a clean summary first.
  const summaryAoa = [
    ['موسسه خیریه درمانی مهر جاوید — گزارش حسابداری'],
    [`بازه‌ی گزارش: ${state.acctRange ? gregorianStrToJalaliLabel(state.acctRange.startDate) + ' تا ' + gregorianStrToJalaliLabel(state.acctRange.endDate) : 'کل بازه‌ی موجود'}`],
    [],
    ['شاخص', 'مبلغ (تومان)'],
    ['کل درآمد', s ? s.totalIncome : 0],
    ['کل هزینه', s ? s.totalExpense : 0],
    ['مانده‌ی خالص', s ? s.netBalance : 0],
    ['هزینه‌های عملیاتی موسسه', s ? (s.institutionalExpense || 0) : 0],
    ['پرداختی به مددجویان', s ? (s.beneficiaryPayments || 0) : 0],
  ];
  if(s && s.byCategory && s.byCategory.length){
    summaryAoa.push([], ['تفکیک بر اساس دسته‌بندی'], ['دسته‌بندی', 'نوع', 'مبلغ (تومان)']);
    s.byCategory.forEach(c => summaryAoa.push([c.category || 'بدون دسته', c.type === 'income' ? 'درآمد' : 'هزینه', c.total]));
  }
  const summarySheet = XLSX.utils.aoa_to_sheet(summaryAoa);
  summarySheet['!cols'] = [{ wch: 34 }, { wch: 18 }, { wch: 16 }];
  summarySheet['!views'] = [{ rightToLeft: true }];
  XLSX.utils.book_append_sheet(workbook, summarySheet, 'خلاصه');

  // Sheet 2 — تراکنش‌ها: the full, filterable transaction ledger.
  const headers = ['تاریخ', 'نوع', 'دسته‌بندی', 'حساب / صندوق', 'مبلغ (تومان)', 'توضیحات', 'نام خیر / منبع', 'پرونده‌ی مرتبط', 'روش پرداخت', 'شماره چک', 'سررسید چک', 'ثبت‌شده توسط'];
  const colWidths = [12, 14, 22, 18, 16, 40, 20, 20, 14, 14, 14, 14];
  const rows = state.acctTransactions.map(t => [
    gregorianStrToJalaliLabel(t.transaction_date),
    t.is_transfer ? 'انتقال بین حساب‌ها' : (t.type === 'income' ? 'درآمد' : 'هزینه'),
    t.category_name || '—',
    t.bank_account_name || '—',
    t.amount,
    t.description || '',
    t.donor_name || '',
    t.related_submission_name || '',
    PAYMENT_METHOD_LABELS_FA[t.payment_method] || t.payment_method,
    t.cheque_number || '',
    t.cheque_due_date ? gregorianStrToJalaliLabel(t.cheque_due_date) : '',
    t.admin_username || '',
  ]);
  const txSheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  txSheet['!cols'] = colWidths.map(wch => ({ wch }));
  txSheet['!views'] = [{ rightToLeft: true }];
  txSheet['!freeze'] = { xSplit: 0, ySplit: 1 };
  txSheet['!autofilter'] = { ref: `A1:${XLSX.utils.encode_col(headers.length - 1)}${rows.length + 1}` };
  XLSX.utils.book_append_sheet(workbook, txSheet, 'تراکنش‌ها');

  XLSX.writeFile(workbook, `گزارش_حسابداری_موسسه.xlsx`);
}

const CHART_PERIOD_LABELS = { daily: 'روزانه', weekly: 'هفتگی', monthly: 'ماهانه', yearly: 'سالانه' };

function formatBucketLabel(bucket, period){
  if(!bucket) return '';
  if(period === 'daily' || period === 'custom'){
    const parts = bucket.split('-').map(Number); // YYYY-MM-DD (Gregorian)
    if(parts.length !== 3) return bucket;
    const j = toJalali(parts[0], parts[1], parts[2]);
    return `${j.jd} ${JALALI_MONTHS[j.jm - 1].slice(0, 3)}`;
  }
  if(period === 'weekly'){
    const m = bucket.match(/^(\d{4})-W(\d+)$/);
    return m ? `هفته ${parseInt(m[2], 10)}` : bucket;
  }
  if(period === 'monthly'){
    const parts = bucket.split('-'); // YYYY-MM
    return parts.length === 2 ? `${parts[1]}/${parts[0].slice(2)}` : bucket;
  }
  return bucket; // yearly: already just YYYY
}

/** Computes {start, end} Date objects for a chart bucket, when precisely determinable (daily/monthly). */
function computeBucketRange(bucket, period){
  if(period === 'daily' || period === 'custom'){
    const parts = bucket.split('-').map(Number);
    if(parts.length !== 3) return null;
    const start = new Date(parts[0], parts[1] - 1, parts[2]);
    const end = new Date(start); end.setDate(end.getDate() + 1);
    return { start, end };
  }
  if(period === 'monthly'){
    const parts = bucket.split('-').map(Number);
    if(parts.length !== 2) return null;
    const start = new Date(parts[0], parts[1] - 1, 1);
    const end = new Date(parts[0], parts[1], 1);
    return { start, end };
  }
  if(period === 'yearly'){
    const y = parseInt(bucket, 10);
    if(!y) return null;
    return { start: new Date(y, 0, 1), end: new Date(y + 1, 0, 1) };
  }
  return null; // weekly buckets aren't precisely reconstructible client-side — not clickable
}

/** Average number of days between submission and the last status change, for
 *  cases that have reached a final outcome (final_review or rejected). Used
 *  for the "میانگین زمان رسیدگی" stat card. Returns null if no finished cases exist. */
function avgResolutionDays(submissions){
  const finished = submissions.filter(s => s.status === 'final_review' || s.status === 'rejected');
  if(!finished.length) return null;
  let totalDays = 0, counted = 0;
  finished.forEach(s => {
    const start = new Date(s.submittedAt);
    const end = new Date(s.statusUpdatedAt || s.submittedAt);
    if(isNaN(start.getTime()) || isNaN(end.getTime())) return;
    totalDays += Math.max(0, (end.getTime() - start.getTime()) / 86400000);
    counted++;
  });
  return counted ? (totalDays / counted) : null;
}

function renderDashboardStatsPanel(container){
  const s = state.dashboardStats;
  if(!s){ container.innerHTML = ''; return; }

  const period = s.period || state.chartPeriod;
  const maxBucket = Math.max(1, ...s.byPeriod.map(m => m.c));

  const chartW = 560, chartH = 150, padBottom = 26, padTop = 24, padSide = 10;
  const n = s.byPeriod.length || 1;
  const usableH = chartH - padBottom - padTop;
  const usableW = chartW - padSide * 2;
  const stepX = n > 1 ? usableW / (n - 1) : 0;

  const points = s.byPeriod.map((m, i) => {
    const x = padSide + i * stepX;
    const y = padTop + (usableH - Math.round((m.c / maxBucket) * usableH));
    return { x, y, m };
  });

  const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = points.length
    ? linePath + ` L${points[points.length - 1].x.toFixed(1)},${padTop + usableH} L${points[0].x.toFixed(1)},${padTop + usableH} Z`
    : '';

  // Show at most ~8 x-axis labels so long ranges (e.g. daily over months) don't overlap.
  const labelEvery = Math.max(1, Math.ceil(n / 8));

  const dotsHtml = points.map((p, i) => {
    const label = formatBucketLabel(p.m.bucket, period);
    const clickable = computeBucketRange(p.m.bucket, period) !== null;
    return `
      <g class="chart-pt-group" data-bucket="${escapeHtml(p.m.bucket)}" data-count="${p.m.c}" data-label="${escapeHtml(label)}" style="cursor:${clickable ? 'pointer' : 'default'};">
        <rect x="${(p.x - stepX / 2).toFixed(1)}" y="${padTop}" width="${(stepX || usableW).toFixed(1)}" height="${usableH}" fill="transparent"></rect>
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" class="chart-dot"></circle>
        ${i % labelEvery === 0 ? `<text x="${p.x.toFixed(1)}" y="${chartH - 6}" text-anchor="middle" class="chart-bar-label">${escapeHtml(label)}</text>` : ''}
      </g>`;
  }).join('');

  const svgChart = `
    <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="${chartH}" class="trend-chart" id="trend-chart-svg">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${padSide}" y1="${padTop + usableH}" x2="${chartW - padSide}" y2="${padTop + usableH}" class="chart-baseline"/>
      ${areaPath ? `<path d="${areaPath}" fill="url(#areaGrad)" stroke="none"></path>` : ''}
      ${linePath ? `<path d="${linePath}" fill="none" class="chart-line"></path>` : ''}
      ${dotsHtml}
    </svg>
    <div class="chart-tooltip" id="chart-tooltip" style="display:none;"></div>`;

  const periodTogglesHtml = Object.keys(CHART_PERIOD_LABELS).map(p => `
    <button type="button" class="chart-period-btn ${(!state.chartCustomRange && period === p) ? 'active' : ''}" data-period="${p}">${CHART_PERIOD_LABELS[p]}</button>
  `).join('');

  const todayStr = new Date().toISOString().slice(0, 10);
  const rangeStart = state.chartCustomRange ? state.chartCustomRange.startDate : '';
  const rangeEnd = state.chartCustomRange ? state.chartCustomRange.endDate : '';
  const dateRangeHtml = `
    <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px;">
      <button type="button" class="jalali-date-btn" id="chart-range-start" data-g="${rangeStart}">${rangeStart ? gregorianStrToJalaliLabel(rangeStart) : 'از تاریخ'}</button>

      ${state.chartCustomRange ? `<button type="button" class="link-btn" id="chart-range-clear" style="font-size:11px;">${ICONS.eyeOff} حذف بازه سفارشی</button>` : ''}
    </div>`;

  const maxSpecialty = Math.max(1, ...s.bySpecialty.map(x => x.c));
  const specialtyHtml = s.bySpecialty.slice(0, 6).map(x => `
    <div class="breakdown-row">

  container.innerHTML = `

      <div class="stats-panel-grid">

          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">

          ${dateRangeHtml}
          ${state.chartDrilldown ? `<div class="drilldown-badge">فیلتر جدول: ${escapeHtml(state.chartDrilldown.label)} <button type="button" id="clear-drilldown">${ICONS.eyeOff} حذف فیلتر</button></div>` : ''}
        </div>
        <div class="mini-card">
          <h4>تفکیک بر اساس تخصص</h4>
          ${specialtyHtml || `<div class="msg-empty">داده‌ای وجود ندارد.</div>`}
        </div>
        <div class="mini-card">
          <h4>تفکیک بر اساس شهر</h4>

  const startBtn = container.querySelector('#chart-range-start');

  const applyRangeBtn = container.querySelector('#chart-range-apply');

      const endDate = endBtn.dataset.g;
      if(!startDate || !endDate){ showToast('لطفاً هر دو تاریخ را انتخاب کنید', 'danger'); return; }

      state.chartCustomRange = { startDate, endDate };
      await loadDashboardStats(null, state.chartCustomRange);
      renderDashboardStatsPanel(container);
    });
  }
  const clearRangeBtn = container.querySelector('#chart-range-clear');
  if(clearRangeBtn){
    clearRangeBtn.addEventListener('click', async ()=>{
      state.chartCustomRange = null;
      await loadDashboardStats(state.chartPeriod);
      renderDashboardStatsPanel(container);
    });
  }

  const tooltip = container.querySelector('#chart-tooltip');
  const svgEl = container.querySelector('#trend-chart-svg');
  container.querySelectorAll('.chart-pt-group').forEach(g=>{
    g.addEventListener('mouseenter', ()=>{
      if(!tooltip || !svgEl) return;
      const count = g.dataset.count;

      tooltip.innerHTML = `<div class="tt-date">${escapeHtml(label)}</div><div class="tt-row"><span class="tt-dot"></span>ثبت‌شده: <strong>${count}</strong></div>`;

    });
  });
  const clearBtn = container.querySelector('#clear-drilldown');
  if(clearBtn){
    clearBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.chartDrilldown = null;
      render();
    });
  }

  container.querySelectorAll('.followup-item[data-id]').forEach(item=>{
    item.addEventListener('click', ()=> openDetail(item.dataset.id));

async function loadSubmissions(){
  state.loadError = null;
  try{
    const data = await apiCall('submission_list_all', {});
    const items = (data.items || []).slice();
    items.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    state.submissions = items;
  }catch(e){
    state.loadError = (e && e.message) ? e.message : String(e);
    state.submissions = [];
  }
}

    ${state.roomList && state.roomList.length ? `

    <div class="quick-filters" id="quick-filters">
      <button type="button" class="filter-chip ${state.quickFilter==='review'?'active':''}" data-filter="review">نیاز به بررسی</button>
