  function getFiltered(){
    const q = state.search.trim();
    let items = state.submissions;
    if(q){
      const tokens = q.split(/\s+/).filter(Boolean);
      items = items.filter(s=>{
        const haystack = [
          s.name, s.fatherName, s.nationalId, s.phone, s.city, s.id,
          (s.companionNames || []).join(' '), s.companionPhone
        ].filter(Boolean).join(' ');
        return tokens.every(t => haystack.includes(t));
      });
    }
    if(state.quickFilter === 'review'){
      items = items.filter(s => s.status === 'submitted' || s.status === 'initial_review');
    } else if(state.quickFilter === 'accommodation'){
      items = items.filter(s => s.needsAccommodation);
    } else if(state.quickFilter === 'incomplete_docs'){
      items = items.filter(s => !(s.medicalDocsMeta && s.medicalDocsMeta.length));
    } else if(state.quickFilter === 'priority'){
      items = items.filter(s => s.priorityFlag);
    } else if(state.quickFilter === 'financial_pending'){
      items = items.filter(s => s.financialStatus === 'pending_review');
    } else if(state.quickFilter === 'stale'){
      items = items.filter(isStaleCase);
    }
    const range = reportPeriodRange(state.reportPeriod);
    if(range){
      items = items.filter(s => {
        const d = new Date(s.submittedAt);
        return !isNaN(d.getTime()) && d >= range.start && d < range.end;
      });
    }
    if(state.chartDrilldown){
      items = items.filter(s => {
        const d = new Date(s.submittedAt);
        return !isNaN(d.getTime()) && d >= state.chartDrilldown.start && d < state.chartDrilldown.end;
      });
    }
    const key = state.sortKey;
    const dir = state.sortDir === 'asc' ? 1 : -1;
    items = items.slice().sort((a, b)=>{
      let av = a[key], bv = b[key];
      if(key === 'submittedAt'){ av = new Date(av || 0).getTime(); bv = new Date(bv || 0).getTime(); }
      else { av = (av || '').toString(); bv = (bv || '').toString(); }
      if(av < bv) return -1 * dir;
      if(av > bv) return 1 * dir;
      return 0;
    });
    return items;
  }

  </div>`);

  function updateBulkBar(){
    bulkBar.style.display = selectedIds.size ? 'flex' : 'none';

  bulkBar.querySelector('#btn-bulk-delete').onclick = async ()=>{

    const ids = Array.from(selectedIds);
    const failedIds = new Set();
    for(const id of ids){
      try{ await apiCallCsrf('submission_delete', { id }); }
      catch(e){ failedIds.add(id); }
    }
    state.submissions = state.submissions.filter(x=>!selectedIds.has(x.id) || failedIds.has(x.id));

  // Excel export — builds a real .xlsx workbook (not CSV) so columns are

  wrap.querySelector('#btn-export').onclick = () => {
    if(typeof XLSX === 'undefined'){
      showToast('کتابخانه‌ی ساخت اکسل هنوز بارگذاری نشده؛ چند ثانیه صبر کنید و دوباره امتحان کنید.', 'danger');
      return;
    }
    const headers = [
      'شماره پیگیری', 'نام و نام خانوادگی', 'نام پدر', 'کد ملی', 'تاریخ تولد',
      'شماره تماس', 'شهر / محل سکونت', 'تخصص پزشکی مورد نیاز', 'نوع مراجعه', 'شرح مشکل',

      'وضعیت پرونده', 'درخواست اسکان', 'تعداد روز اسکان', 'تعداد همراهان',

      'عکس کارت ملی ارسال‌شده', 'اولویت‌دار', 'یادداشت اولویت',

    ];

    const rows = getFiltered().map(s => {
      let fullDate = '';
      if(s.submittedAt){
        const d = new Date(s.submittedAt);
        if(!isNaN(d.getTime())) fullDate = d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
      }
      return [
        s.id,
        s.name || '', s.fatherName || '', s.nationalId || '', s.dob || '',
        s.phone || '', s.city || '', s.specialtyLabel || '', s.visitTypeLabel || '', s.problemDescription || '',
        s.appointmentDateFrom || '', s.appointmentDateTo || '', s.appointmentTimeSlotLabel || '',
        s.statusLabel || s.status || '',
        s.needsAccommodation ? 'دارد' : 'ندارد',
        s.needsAccommodation ? (s.accommodationDays || '') : '',
        s.needsAccommodation ? (s.companionCount || '') : '',
        s.needsAccommodation ? (s.companionPhone || '') : '',
        (s.companionNames && s.companionNames.length) ? s.companionNames.join('؛ ') : '',
        (s.companionFatherNames && s.companionFatherNames.length) ? s.companionFatherNames.join('؛ ') : '',
        (s.companionNationalIds && s.companionNationalIds.length) ? s.companionNationalIds.join('؛ ') : '',
        (s.medicalDocsMeta ? s.medicalDocsMeta.length : 0),
        s.hasFullPhoto ? 'بله' : 'خیر',
        s.priorityFlag ? 'بله' : 'خیر',
        s.priorityNote || '',
        s.financialStatusLabel || 'بدون درخواست کمک مالی',
        s.requestedAmount || '',
        s.approvedAmount || '',
        s.manualEntry ? 'بله' : 'خیر',
        fullDate
      ];
    });

    const sheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    const colWidthMap = {
      0: 16, 1: 22, 2: 18, 3: 14, 4: 12, 5: 14, 6: 16, 7: 22, 8: 14, 9: 40,
      10: 16, 11: 16, 12: 16, 13: 20, 14: 12, 15: 12, 16: 12, 17: 16, 18: 26,
      19: 26, 20: 22, 21: 14, 22: 14, 23: 12, 24: 16, 25: 20, 26: 16, 27: 16,
      28: 16, 29: 18,
    };
    sheet['!cols'] = headers.map((h, i) => ({ wch: colWidthMap[i] || Math.max(12, h.length + 4) }));
    sheet['!views'] = [{ rightToLeft: true }];
    sheet['!freeze'] = { xSplit: 0, ySplit: 1 };
    sheet['!autofilter'] = { ref: `A1:${XLSX.utils.encode_col(headers.length - 1)}${rows.length + 1}` };
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, 'گزارش مددجویان');
    XLSX.writeFile(workbook, `گزارش_پرونده_مددجویان_${state.reportPeriod}.xlsx`);

  /** Builds a clean, formal <table> (real thead/tbody, full borders, no
   *  checkboxes/thumbnails/hover chrome) into #dashboard-print-table-holder
   *  right before printing — the on-screen table includes UI-only columns
   *  (checkbox, photo thumbnail) that don't belong in a printed report. */
  function buildDashboardPrintTable(){
    const holder = wrap.querySelector('#dashboard-print-table-holder');
    if(!holder) return;
    const filtered = getFiltered();
    holder.innerHTML = `
      <table>
        <thead><tr>
          <th>نام و نام خانوادگی</th><th>کد ملی</th><th>شماره تماس</th><th>شهر</th>
          <th>تخصص مورد نیاز</th><th>وضعیت پرونده</th><th>تاریخ ثبت</th>
        </tr></thead>
        <tbody>
          ${filtered.map(s => {
            let dateLabel = '—';
            if(s.submittedAt){
              const dd = new Date(s.submittedAt);
              if(!isNaN(dd.getTime())) dateLabel = dd.toLocaleDateString('fa-IR');
            }
            return `<tr>
              <td>${escapeHtml(s.name || 'نامشخص')}</td>
              <td>${escapeHtml(s.nationalId || '—')}</td>
              <td>${escapeHtml(s.phone || '—')}</td>
              <td>${escapeHtml(s.city || '—')}</td>
              <td>${escapeHtml(s.specialtyLabel || '—')}</td>
              <td>${escapeHtml(s.statusLabel || s.status || '—')}</td>
              <td>${dateLabel}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function buildTable(){
    const node = buildTableInner();
    node.id = 'table-holder';
    return node;
  }
  function buildTableInner(){
    if(state.loadingSubs){
      return el(`<div class="card table-card" style="padding:0;">${
        Array.from({length:5}).map(()=>`
          <div class="skeleton-row">
            <div class="skeleton-block" style="width:38px; height:38px; border-radius:8px;"></div>
            <div class="skeleton-block" style="width:22%; height:12px;"></div>
            <div class="skeleton-block" style="width:15%; height:12px;"></div>
            <div class="skeleton-block" style="width:18%; height:12px;"></div>
            <div class="skeleton-block" style="width:16%; height:12px; margin-right:auto;"></div>
          </div>`).join('')
      }</div>`);
    }
    if(state.loadError){
      return el(`<div class="card table-card"><div class="empty-state" style="color:#c0392b;">
        <div>خطا در دریافت اطلاعات از دیتابیس:</div>
        <div style="font-size:12px; margin-top:8px; direction:ltr; text-align:center;">${state.loadError}</div>
      </div></div>`);
    }
    const filtered = getFiltered();
    if(filtered.length === 0){
      const hasFilter = !!state.search.trim() || state.quickFilter !== 'all';
      return el(`<div class="card table-card"><div class="empty-state">${ICONS.inbox}
        <div class="empty-title">${hasFilter ? 'با این جستجو/فیلتر چیزی پیدا نشد' : 'هنوز پرونده‌ای ثبت نشده'}</div>
        <div class="empty-hint">${hasFilter ? 'عبارت جستجو یا فیلتر را تغییر دهید.' : 'با ثبت اولین پرونده، لیست اینجا نمایش داده می‌شود.'}</div>
      </div></div>`);
    }
    // Duplicate-patient signal: same phone number used across different national IDs.
    const phoneToNids = {};
    state.submissions.forEach(s => {
      if(!s.phone) return;
      (phoneToNids[s.phone] = phoneToNids[s.phone] || new Set()).add(s.nationalId);
    });
    const duplicatePhones = new Set(Object.keys(phoneToNids).filter(p => phoneToNids[p].size > 1));
    const searchTokens = state.search.trim().split(/\s+/).filter(Boolean);
    // Pagination: only the current page's rows are rendered to the DOM (better
    // performance with large lists); bulk-select/sort still act on all `filtered` items.
    const pageSize = state.tablePageSize || 50;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
    if(state.tablePage > totalPages) state.tablePage = totalPages;
    if(!state.tablePage || state.tablePage < 1) state.tablePage = 1;
    const pageStart = (state.tablePage - 1) * pageSize;
    const pagedItems = filtered.slice(pageStart, pageStart + pageSize);
    /** Wraps any of the current search tokens found in `text` with <mark>, for quick visual scanning. */
    function hl(text){
      const safe = escapeHtml(text == null ? '' : String(text));
      if(!searchTokens.length) return safe;
      let out = safe;
      searchTokens.forEach(t=>{
        const esc = escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if(esc) out = out.replace(new RegExp('(' + esc + ')', 'gi'), '<mark class="search-hit">$1</mark>');
      });
      return out;
    }
    const rowsHtml = pagedItems.map(s => {
      const safeName = s.name ? hl(s.name) : 'نامشخص';

      tr.onclick = (e)=>{ if(e.target.classList.contains('row-select')) return; openDetail(tr.dataset.id); };
    });
    table.querySelectorAll('.row-select').forEach(cb=>{
      cb.addEventListener('click', (e)=> e.stopPropagation());
      cb.addEventListener('change', ()=>{
        if(cb.checked) selectedIds.add(cb.dataset.id); else selectedIds.delete(cb.dataset.id);

        const selectAll = table.querySelector('#select-all-rows');

    });
    const selectAllBox = table.querySelector('#select-all-rows');

      selectAllBox.addEventListener('click', (e)=> e.stopPropagation());

        table.querySelectorAll('.row-select').forEach(cb=>{ cb.checked = selectedIds.has(cb.dataset.id); });
      });
    }
    const pagePrevBtn = table.querySelector('#table-page-prev');
    if(pagePrevBtn){
      pagePrevBtn.addEventListener('click', ()=>{
        state.tablePage = Math.max(1, state.tablePage - 1);

      });
    }
    const pageNextBtn = table.querySelector('#table-page-next');
    if(pageNextBtn){
      pageNextBtn.addEventListener('click', ()=>{
        state.tablePage = Math.min(totalPages, state.tablePage + 1);
        wrap.querySelector('#table-holder').replaceWith(buildTable());
      });
    }
    return table;
  }

  animateStatCounters(wrap);
  return wrap;
}

function animateStatCounters(root){
  const nums = root.querySelectorAll('.stat-card .num[data-count]');
  nums.forEach(node=>{
    const target = parseInt(node.getAttribute('data-count'), 10) || 0;
    const duration = 600;
    const start = performance.now();
    function step(now){
      const progress = Math.min((now - start) / duration, 1);
      node.textContent = Math.round(target * (1 - Math.pow(1 - progress, 3))).toLocaleString('fa-IR');
      if(progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function sanitizeFileName(str){
  return String(str || 'فایل').replace(/[\\/:*?"<>|]/g, '').trim() || 'فایل';
}
const REPORT_PERIOD_LABELS = { all: 'همه', today: 'روزانه (امروز)', week: 'هفتگی (این هفته)', month: 'ماهانه (این ماه)', year: 'سالانه (امسال)' };

/** Returns {start, end} Date objects for the requested report period, or null for 'all' (no filtering). */
function reportPeriodRange(period){
  const now = new Date();
  if(period === 'today'){
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const end = new Date(start); end.setDate(end.getDate() + 1);
    return { start, end };
  }
  if(period === 'week'){
    const day = now.getDay(); // 0 = Sunday
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
    const end = new Date(start); end.setDate(end.getDate() + 7);
    return { start, end };
  }
  if(period === 'month'){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return { start, end };
  }
  if(period === 'year'){
    const start = new Date(now.getFullYear(), 0, 1);
    const end = new Date(now.getFullYear() + 1, 0, 1);
    return { start, end };
  }
  return null;
}

function formatDate(iso){
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return 'تاریخ نامشخص';
    return d.toLocaleDateString('fa-IR') + ' - ' + d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return iso; }
}

        <div style="display:flex; gap:8px;">

          <button type="button" class="btn-outline" id="submission-edit-cancel">انصراف</button>
        </div>
      </form>
      ` : `
      ${s.hasFullPhoto ? (
        state.detailDocsLoading 
          ? `<div style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">در حال بارگذاری عکس...</div>`
          : `<a href="${state.detailPhoto || s.photoThumb || s.photo || ''}" download="${sanitizeFileName(s.name)}-کارت-ملی.jpg" title="دانلود عکس"><img class="detail-photo" src="${state.detailPhoto || s.photoThumb || s.photo || ''}"></a>`
      ) : ''}
      <div class="detail-row"><span class="k">نام و نام خانوادگی</span><span class="v">${escapeHtml(s.name || '—')}</span></div>
      <div class="detail-row"><span class="k">نام پدر</span><span class="v">${escapeHtml(s.fatherName || '—')}</span></div>
      <div class="detail-row"><span class="k">کد ملی</span><span class="v">${s.nationalId || '—'}</span></div>
      <div class="detail-row"><span class="k">تاریخ تولد</span><span class="v">${s.dob || '—'}</span></div>
      <div class="detail-row"><span class="k">شماره تماس</span><span class="v">${s.phone || '—'}</span></div>
      <div class="detail-row"><span class="k">شهر / محل سکونت</span><span class="v">${escapeHtml(s.city || '—')}</span></div>

      ${s.referrerPhone ? `<div class="detail-row"><span class="k">شماره تماس معرف</span><span class="v">${escapeHtml(s.referrerPhone)}</span></div>` : ''}
      <div class="detail-row"><span class="k">تخصص پزشکی مورد نیاز</span><span class="v">${escapeHtml(s.specialtyLabel || '—')}</span></div>

        <div style="font-size:14px; color:var(--text); line-height:1.8; white-space:pre-wrap;">${escapeHtml(s.problemDescription)}</div>

      <div class="detail-row"><span class="k">بازه تاریخ درخواستی نوبت</span><span class="v">${(s.appointmentDateFrom || s.appointmentDateTo) ? `${escapeHtml(s.appointmentDateFrom || '—')} تا ${escapeHtml(s.appointmentDateTo || '—')}` : '—'}</span></div>
      <div class="detail-row"><span class="k">بازه زمانی ترجیحی</span><span class="v">${escapeHtml(s.appointmentTimeSlotLabel || '—')}</span></div>
      <div class="detail-row"><span class="k">درخواست اسکان</span><span class="v">${s.needsAccommodation ? 'دارد' : 'ندارد'}</span></div>
      ${s.needsAccommodation ? `
      <div class="detail-row"><span class="k">تعداد روز مورد نیاز</span><span class="v">${escapeHtml(s.accommodationDays || '—')}</span></div>
      <div class="detail-row"><span class="k">تعداد همراهان</span><span class="v">${escapeHtml(s.companionCount || '—')}</span></div>
      <div class="detail-row"><span class="k">شماره تماس همراه شماره ۱</span><span class="v" style="font-weight:700; color:var(--primary-dark);">${escapeHtml(s.companionPhone || '—')}</span></div>
      ${(s.companionNames && s.companionNames.length) ? `
      <div style="margin-top:14px; overflow-x:auto;">
        ${state.detailDocsLoading
          ? `<div style="font-size:12.5px; color:var(--text-muted);">در حال بارگذاری اطلاعات همراهان...</div>`
          : `<table style="width:100%; border-collapse:collapse; font-size:13px;">
              <thead>
                <tr style="border-bottom:2px solid var(--field-border);">
                  <th style="text-align:right; padding:8px 6px; color:var(--primary-dark);">نام همراه</th>
                  <th style="text-align:right; padding:8px 6px; color:var(--primary-dark);">نام پدر</th>
                  <th style="text-align:right; padding:8px 6px; color:var(--primary-dark);">کد ملی</th>
                  <th style="text-align:right; padding:8px 6px; color:var(--primary-dark);">عکس کارت ملی</th>
                </tr>
              </thead>
              <tbody>
                ${s.companionNames.map((cname, i)=>{
                  const fatherName = (s.companionFatherNames && s.companionFatherNames[i]) || '';
                  const nid = (s.companionNationalIds && s.companionNationalIds[i]) || '';
                  const photo = state.detailCompanionPhotos[i];
                  return `<tr style="border-bottom:1px solid var(--border);">
                    <td style="padding:8px 6px; font-weight:600;">${escapeHtml(cname || '—')}</td>
                    <td style="padding:8px 6px; color:var(--text-muted);">${escapeHtml(fatherName || '—')}</td>
                    <td style="padding:8px 6px; color:var(--text-muted);">${nid || '—'}</td>
                    <td style="padding:8px 6px;">
                      ${photo
                        ? `<a href="${photo}" download="${sanitizeFileName(cname || ('همراه-' + (i+1)))}-کارت-ملی.jpg" title="دانلود عکس"><img src="${photo}" style="width:40px; height:40px; object-fit:cover; border-radius:6px; border:1px solid var(--field-border);"></a>`
                        : `<span style="color:var(--text-muted); font-size:11.5px;">بدون عکس</span>`
                      }
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>`
        }
      </div>
      ` : ''}
      ` : ''}
      `}
      <div class="detail-row"><span class="k">تاریخ ثبت</span><span class="v">${formatDate(s.submittedAt)}</span></div>
      ${docsMeta.length ? `
      <div style="margin-top:16px;">
        <div class="detail-row" style="border-bottom:none; padding-bottom:6px;"><span class="k">مدارک پزشکی</span></div>
        <div class="multi-upload-list" id="detail-docs-list">
          ${state.detailDocsLoading
            ? `<div style="font-size:12.5px; color:var(--text-muted);">در حال بارگذاری مدارک...</div>`
            : (state.detailDocs || []).map(d=> d.type && d.type.startsWith('image/')
                ? `<a href="${d.dataUrl}" download="${escapeHtml(d.name)}" class="doc-chip" style="text-decoration:none;"><img src="${d.dataUrl}"><div class="doc-name">${escapeHtml(d.name)}</div></a>`
                : `<a href="${d.dataUrl}" download="${escapeHtml(d.name)}" class="doc-chip" style="text-decoration:none;"><div class="doc-icon">FILE</div><div class="doc-name">${escapeHtml(d.name)}</div></a>`
              ).join('')
          }
        </div>
        ${state.detailMetaLoading ? '' : state.detailDocStatuses.map((ds, i) => `
          <div class="doc-check-row" data-idx="${ds.idx}">
            <span style="font-size:12.5px;">${escapeHtml(ds.name)}</span>
            <span style="display:flex; align-items:center; gap:8px;">
              <span class="status-badge" style="background:${DOC_STATUS_COLORS[ds.doc_status]}22; color:${DOC_STATUS_COLORS[ds.doc_status]};">${DOC_STATUS_LABELS[ds.doc_status] || ds.doc_status}</span>
              <button type="button" class="btn-outline doc-status-btn" data-idx="${ds.idx}" data-status="approved" style="padding:4px 10px; font-size:11.5px;">تأیید</button>
              <button type="button" class="btn-outline doc-status-btn" data-idx="${ds.idx}" data-status="needs_correction" style="padding:4px 10px; font-size:11.5px;">نیاز به اصلاح</button>
            </span>
          </div>
        `).join('')}
      </div>
      ` : ''}

      <div class="review-section" style="margin-top:18px;">
        <h4>${ICONS.bell} پیام‌ها با مددجو</h4>
        <div id="admin-msg-thread"></div>
      </div>

      <button class="submit-btn danger" id="btn-delete" style="margin-top:20px;">${ICONS.trash} حذف این رکورد</button>
    </div>
  </div>`);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ closeDetail(); } });
  overlay.querySelector('#modal-close').onclick = ()=>{ closeDetail(); };
  overlay.querySelector('#btn-copy-id').onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(s.id);
      showToast('شماره پیگیری کپی شد');
    }catch(e){
      showToast('کپی خودکار ممکن نشد', 'danger');
    }
  };
  overlay.querySelector('#btn-toggle-priority').onclick = async ()=>{
    const nextFlag = !s.priorityFlag;
    let note = '';
    if(nextFlag){
      note = prompt('یادداشت اولویت (اختیاری):') || '';
    }
    try{
      await apiCallCsrf('submission_set_priority', { id: s.id, flag: nextFlag ? '1' : '0', note });
      s.priorityFlag = nextFlag;
      s.priorityNote = note || null;
      renderKeepModalScroll();
      showToast(nextFlag ? 'پرونده به‌عنوان اولویت‌دار علامت‌گذاری شد' : 'علامت اولویت حذف شد');
    }catch(err){
      showToast(err.message || 'خطا در بروزرسانی اولویت', 'danger');
    }
  };

  overlay.querySelector('#btn-edit-profile').onclick = ()=>{
    state.submissionEditMode = !state.submissionEditMode;
    renderKeepModalScroll();
  };
  const submissionEditForm = overlay.querySelector('#submission-edit-form');
  if(submissionEditForm){
    overlay.querySelector('#submission-edit-cancel').onclick = ()=>{
      state.submissionEditMode = false;
      renderKeepModalScroll();
    };
    submissionEditForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const saveBtn = overlay.querySelector('#submission-edit-save');
      const name = overlay.querySelector('#edit-name').value.trim();
      if(!name){ showToast('لطفاً نام و نام خانوادگی را وارد کنید', 'danger'); return; }
      const payload = {
        id: s.id,
        name,
        fatherName: overlay.querySelector('#edit-father-name').value.trim(),
        dob: overlay.querySelector('#edit-dob').value.trim(),
        phone: overlay.querySelector('#edit-phone').value.trim(),
        city: overlay.querySelector('#edit-city').value.trim(),
        companionPhone: overlay.querySelector('#edit-companion-phone').value.trim(),
        companionCount: overlay.querySelector('#edit-companion-count').value.trim(),
        problemDescription: overlay.querySelector('#edit-problem-description').value.trim(),
      };
      saveBtn.disabled = true;
      try{
        await apiCallCsrf('submission_update', payload);
        Object.assign(s, {
          name: payload.name, fatherName: payload.fatherName, dob: payload.dob, phone: payload.phone,
          city: payload.city, companionPhone: payload.companionPhone, companionCount: payload.companionCount,
          problemDescription: payload.problemDescription,
        });
        state.submissionEditMode = false;
        const timelineData = await apiCall('submission_timeline_get', { id: s.id });
        state.detailTimeline = timelineData.items || [];
        showToast('پروفایل مددجو بروزرسانی شد');
        renderKeepModalScroll();
      }catch(err){
        saveBtn.disabled = false;
        showToast(err.message || 'خطا در ذخیره‌ی پروفایل مددجو', 'danger');
      }
    });
  }

  const approveBtn = overlay.querySelector('#btn-financial-approve');
  wireAmountInput(overlay.querySelector('#approved-amount-input'), overlay.querySelector('#approved-amount-words'));
  if(approveBtn){
    approveBtn.onclick = async ()=>{
      const raw = overlay.querySelector('#approved-amount-input').value.replace(/[^\d]/g, '');
      const approvedAmount = parseInt(raw, 10);
      if(!approvedAmount || approvedAmount <= 0){ showToast('لطفاً مبلغ معتبری وارد کنید', 'danger'); return; }
      const note = prompt('یادداشت برای مددجو (اختیاری):') || '';
      approveBtn.disabled = true;
      try{
        await apiCallCsrf('financial_review', { id: s.id, decision: 'approve', approvedAmount, note });
        s.approvedAmount = approvedAmount;
        s.financialStatus = 'approved';
        s.financialStatusLabel = 'تایید شده — در انتظار پرداخت';
        s.financialNote = note || null;
        const timelineData = await apiCall('submission_timeline_get', { id: s.id });
        state.detailTimeline = timelineData.items || [];
        showToast('درخواست کمک مالی تایید شد');
        renderKeepModalScroll();
      }catch(err){
        approveBtn.disabled = false;
        showToast(err.message || 'خطا در تایید درخواست', 'danger');
      }
    };
  }
  const rejectBtn = overlay.querySelector('#btn-financial-reject');
  if(rejectBtn){
    rejectBtn.onclick = async ()=>{
      if(!confirm('آیا از رد این درخواست کمک مالی مطمئن هستید؟')) return;
      const note = prompt('دلیل رد (اختیاری، برای مددجو نمایش داده می‌شود):') || '';
      rejectBtn.disabled = true;
      try{
        await apiCallCsrf('financial_review', { id: s.id, decision: 'reject', note });
        s.financialStatus = 'rejected';
        s.financialStatusLabel = 'رد شده';
        s.financialNote = note || null;
        const timelineData = await apiCall('submission_timeline_get', { id: s.id });
        state.detailTimeline = timelineData.items || [];
        showToast('درخواست رد شد');
        renderKeepModalScroll();
      }catch(err){
        rejectBtn.disabled = false;
        showToast(err.message || 'خطا در رد درخواست', 'danger');
      }
    };
  }
  const recordPaymentBtn = overlay.querySelector('#btn-record-payment');
  wireAmountInput(overlay.querySelector('#payment-amount-input'), overlay.querySelector('#payment-amount-words'));
  if(recordPaymentBtn){
    recordPaymentBtn.onclick = async ()=>{
      const raw = overlay.querySelector('#payment-amount-input').value.replace(/[^\d]/g, '');
      const amount = parseInt(raw, 10);
      if(!amount || amount <= 0){ showToast('لطفاً مبلغ معتبری وارد کنید', 'danger'); return; }
      const note = prompt('یادداشت برای این پرداخت (اختیاری):') || '';
      recordPaymentBtn.disabled = true;
      try{
        const data = await apiCallCsrf('payment_record', { id: s.id, amount, note });
        state.detailPaymentsTotal = data.totalPaid || (state.detailPaymentsTotal + amount);
        state.detailPayments.push({ amount, note: note || null, admin_username: '', created_at: new Date().toISOString() });
        s.financialStatus = data.status || 'partially_paid';
        s.financialStatusLabel = FINANCIAL_STATUS_LABELS_FA[s.financialStatus] || s.financialStatusLabel;
        const timelineData = await apiCall('submission_timeline_get', { id: s.id });
        state.detailTimeline = timelineData.items || [];
        showToast('پرداخت ثبت شد');
        renderKeepModalScroll();
      }catch(err){
        recordPaymentBtn.disabled = false;
        showToast(err.message || 'خطا در ثبت پرداخت', 'danger');
      }
    };
  }

  const roomCheckinBtn = overlay.querySelector('#room-checkin-date');
  if(roomCheckinBtn){
    roomCheckinBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openJalaliCalendarPopup(roomCheckinBtn, roomCheckinBtn.dataset.g, (g)=>{ roomCheckinBtn.dataset.g = g; roomCheckinBtn.textContent = gregorianStrToJalaliLabel(g); });
    });
  }
  const roomAssignBtn = overlay.querySelector('#btn-room-assign');
  if(roomAssignBtn){
    roomAssignBtn.onclick = async ()=>{
      const roomId = overlay.querySelector('#room-select').value;
      const checkInDate = overlay.querySelector('#room-checkin-date').dataset.g;
      if(!roomId){ showToast('لطفاً اتاق را انتخاب کنید', 'danger'); return; }
      roomAssignBtn.disabled = true;
      try{
        await apiCallCsrf('accommodation_assign_room', { roomId, submissionId: s.id, checkInDate });
        showToast('اتاق تخصیص داده شد');
        const roomData = await apiCall('accommodation_room_list', {});
        state.accommodationRooms = roomData.items || [];
        state.roomList = state.accommodationRooms;
        const timelineData = await apiCall('submission_timeline_get', { id: s.id });
        state.detailTimeline = timelineData.items || [];
        renderKeepModalScroll();
      }catch(err){
        roomAssignBtn.disabled = false;
        showToast(err.message || 'خطا در تخصیص اتاق', 'danger');
      }
    };
  }
  const roomCheckoutBtn = overlay.querySelector('#btn-room-checkout');
  if(roomCheckoutBtn){
    roomCheckoutBtn.onclick = async ()=>{
      if(!confirm('آیا از خروج مددجو و آزادسازی این اتاق مطمئن هستید؟')) return;
      const checkOutDate = new Date().toISOString().slice(0, 10);
      roomCheckoutBtn.disabled = true;
      try{
        await apiCallCsrf('accommodation_checkout', { assignmentId: roomCheckoutBtn.dataset.assignment, checkOutDate });
        showToast('اتاق آزاد شد');
        const roomData = await apiCall('accommodation_room_list', {});
        state.accommodationRooms = roomData.items || [];
        state.roomList = state.accommodationRooms;
        renderKeepModalScroll();
      }catch(err){
        roomCheckoutBtn.disabled = false;
        showToast(err.message || 'خطا در آزادسازی اتاق', 'danger');
      }
    };
  }

  overlay.querySelector('#btn-record-pdf').onclick = ()=>{
    showToast('پنجره چاپ باز شد؛ در آن «ذخیره به‌صورت PDF» را انتخاب کنید');
    document.body.classList.add('printing-record');
    const cleanup = ()=> document.body.classList.remove('printing-record');
    window.addEventListener('afterprint', cleanup, { once: true });
    setTimeout(()=>{
      window.print();
      setTimeout(cleanup, 500);
    }, 300);
  };
  overlay.querySelector('#btn-record-word').onclick = ()=>{
    downloadSubmissionAsWord(s, state.detailPayments, state.detailPaymentsTotal);
  };
  overlay.querySelector('#btn-delete').onclick = async ()=>{
    if(!confirm('آیا از حذف این رکورد مطمئن هستید؟ این عملیات قابل بازگشت نیست.')) return;
    try{
      await apiCallCsrf('submission_delete', { id: s.id });
      state.submissions = state.submissions.filter(x=>x.id !== s.id);
      state.detailId = null;
      render();
      showToast('رکورد حذف شد');
    }catch(err){
      showToast(err.message || 'خطا در حذف رکورد', 'danger');
    }
  };

  const updateStatusBtn = overlay.querySelector('#btn-update-status');
  if(updateStatusBtn){
    updateStatusBtn.onclick = async ()=>{
      const status = overlay.querySelector('#status-select').value;
      const noteInput = overlay.querySelector('#status-note');
      const note = noteInput.value.trim();
      if(CASE_STATUSES_REQUIRING_NOTE.includes(status) && !note){
        noteInput.classList.add('invalid');
        showToast('برای این وضعیت باید توضیح/نتیجه را به‌صورت دستی بنویسید', 'danger');
        return;
      }
      noteInput.classList.remove('invalid');
      updateStatusBtn.disabled = true;
      try{
        await apiCallCsrf('submission_set_status', { id: s.id, status, note });
        const cs = CASE_STATUSES.find(c => c.value === status);
        s.status = status;
        s.statusLabel = cs ? cs.label : status;
        s.statusColor = cs ? cs.color : '#6B7280';
        const timelineData = await apiCall('submission_timeline_get', { id: s.id });
        state.detailTimeline = timelineData.items || [];
        noteInput.value = '';
        showToast('وضعیت پرونده بروزرسانی شد');
        renderKeepModalScroll();
      }catch(err){
        showToast(err.message || 'خطا در بروزرسانی وضعیت', 'danger');
      }finally{
        updateStatusBtn.disabled = false;
      }
    };
  }

  overlay.querySelectorAll('.doc-status-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      const status = btn.dataset.status;
      const note = status === 'needs_correction' ? (prompt('توضیح برای مددجو درباره‌ی این مدرک (اختیاری):') || '') : '';
      try{
        await apiCallCsrf('doc_set_status', { id: s.id, idx, status, note });
        const data = await apiCall('doc_status_list', { id: s.id });
        state.detailDocStatuses = data.items || [];
        showToast('وضعیت مدرک بروزرسانی شد');
        renderKeepModalScroll();
      }catch(err){
        showToast(err.message || 'خطا در بروزرسانی وضعیت مدرک', 'danger');
      }
    };
  });

  if(!state.detailMetaLoading){
    renderMessageThread(overlay.querySelector('#admin-msg-thread'), s.id, 'admin');
  }

  return overlay;
}

function openDetail(id){
  state.detailId = id;
  state.detailDocs = [];
  state.detailDocsLoading = true;
  state.detailCompanionPhotos = [];
  state.detailPhoto = null;
  state.detailReceiptPhotos = [];
  state.accommodationRooms = [];
  state.detailTimeline = [];
  state.detailDocStatuses = [];
  state.detailMessages = [];
  state.detailPayments = [];
  state.detailPaymentsTotal = 0;
  state.detailMetaLoading = true;
  state.submissionEditMode = false;
  render();

  (async ()=>{
    try{
      const [timelineData, docStatusData, msgData, payData] = await Promise.all([
        apiCall('submission_timeline_get', { id }),
        apiCall('doc_status_list', { id }),
        apiCall('message_list', { id }),
        apiCall('payment_list', { id }),
      ]);
      if(state.detailId !== id) return;
      state.detailTimeline = timelineData.items || [];
      state.detailDocStatuses = docStatusData.items || [];
      state.detailMessages = msgData.items || [];
      state.detailPayments = payData.items || [];
      state.detailPaymentsTotal = payData.total || 0;
    }catch(e){
      // Non-fatal — the rest of the modal still renders without this section.
    }
    const sub = state.submissions.find(x=>x.id === id);
    if(sub && sub.requestedAmount){
      try{
        const count = sub.receiptCount || 1; // older records predate receiptCount — assume at least 1
        const photos = [];
        for(let i=0; i<count; i++){
          try{
            const data = await apiCall('submission_asset', { id, kind: 'receipt', idx: i });
            photos.push(data.dataUrl);
          }catch(e){ break; } // stop at the first missing index
        }
        if(state.detailId === id) state.detailReceiptPhotos = photos;
      }catch(e){ /* no receipt photos for this request — fine */ }
    }
    if(sub && sub.needsAccommodation){
      try{
        const roomData = await apiCall('accommodation_room_list', {});
        if(state.detailId === id) state.accommodationRooms = roomData.items || [];
      }catch(e){ /* room list optional — fine if it fails */ }
    }
    if(state.detailId === id){
      state.detailMetaLoading = false;
      render();
    }
  })();

  const s = state.submissions.find(x=>x.id === id);
  const docsMeta = (s && s.medicalDocsMeta) || [];
  const compPhotoCount = s ? (s.companionPhotoCount || 0) : 0;
  const hasFullPhoto = s && s.hasFullPhoto;
  if(!docsMeta.length && !compPhotoCount && !hasFullPhoto){
    state.detailDocsLoading = false;
    render();
    return;
  }
  (async ()=>{
    const docs = [];
    for(let i=0; i<docsMeta.length; i++){
      try{
        const data = await apiCall('submission_asset', { id, kind: 'doc', idx: i });
        docs.push({ name: data.name, type: data.mime, dataUrl: data.dataUrl });
      }catch(e){}
    }
    const companionPhotos = [];
    for(let i=0; i<compPhotoCount; i++){
      try{
        const data = await apiCall('submission_asset', { id, kind: 'companionPhoto', idx: i });
        companionPhotos.push(data.dataUrl);
      }catch(e){ companionPhotos.push(null); }
    }
    let detailPhoto = null;
    if(hasFullPhoto){
      try{
        const data = await apiCall('submission_asset', { id, kind: 'photo', idx: 0 });
        detailPhoto = data.dataUrl;
      }catch(e){}
    }
    if(state.detailId === id){
      state.detailDocs = docs;
      state.detailCompanionPhotos = companionPhotos;
      state.detailPhoto = detailPhoto;
      state.detailDocsLoading = false;
      render();
    }
  })();
}

function closeDetail(){
  state.detailId = null;
  state.detailDocs = [];
  state.detailDocsLoading = false;
  state.detailCompanionPhotos = [];
  state.detailPhoto = null;
  state.detailReceiptPhotos = [];
  state.accommodationRooms = [];
  state.detailTimeline = [];
  state.detailDocStatuses = [];
  state.detailMessages = [];
  state.detailPayments = [];
  state.detailPaymentsTotal = 0;
  state.detailMetaLoading = false;
  state.submissionEditMode = false;
  render();
}

function renderPasswordModal(){
  const overlay = el(`<div class="modal-overlay">
    <div class="modal" style="max-width:400px;">
      <button class="modal-close" id="pw-close" aria-label="بستن پنجره">×</button>
      <h3 style="clear:both;">تغییر رمز عبور مدیر</h3>
      <form id="pw-form">
        <div class="field">
          <label>رمز عبور فعلی</label>
          <div class="pass-wrap"><input type="password" id="pw-current"><button type="button" class="pass-toggle-btn" aria-label="نمایش رمز عبور">${ICONS.eye}</button></div>
        </div>
        <div class="field">
          <label>رمز عبور جدید <span class="hint">(حداقل ۶ کاراکتر)</span></label>
          <div class="pass-wrap"><input type="password" id="pw-new"><button type="button" class="pass-toggle-btn" aria-label="نمایش رمز عبور">${ICONS.eye}</button></div>
        </div>
        <div class="field">
          <label>تکرار رمز عبور جدید</label>
          <div class="pass-wrap"><input type="password" id="pw-confirm"><button type="button" class="pass-toggle-btn" aria-label="نمایش رمز عبور">${ICONS.eye}</button></div>
        </div>
        <button type="submit" class="submit-btn">${ICONS.check} ذخیره تغییرات</button>
      </form>
    </div>
  </div>`);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ state.showPwModal=false; render(); } });
  overlay.querySelector('#pw-close').onclick = ()=>{ state.showPwModal=false; render(); };
  overlay.querySelector('#pw-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const current = overlay.querySelector('#pw-current').value;
    const next = overlay.querySelector('#pw-new').value;
    const confirmVal = overlay.querySelector('#pw-confirm').value;
    if(next.length < 6 || next !== confirmVal){
      showToast('رمز عبور جدید نامعتبر است یا با تکرار آن مطابقت ندارد', 'danger');
      return;
    }
    try{
      await apiCallCsrf('admin_change_password', { current, next });
      state.showPwModal = false;
      render();
      showToast('رمز عبور با موفقیت تغییر کرد');
    }catch(err){
      showToast(err.message || 'رمز عبور فعلی اشتباه است', 'danger');
    }
  });
  wirePasswordToggles(overlay);
  return overlay;
}

/* ============ global keyboard shortcuts ============ */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const lightbox = document.querySelector('.lightbox-overlay');
    if(lightbox){ lightbox.remove(); return; }
    if(state.showCommandPalette){ state.showCommandPalette = false; render(); return; }
    if(state.showPwModal){ state.showPwModal = false; render(); return; }
    if(state.detailId){ closeDetail(); return; }
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    state.showCommandPalette = !state.showCommandPalette;
    render();
  }
  if(e.key === '/' && !state.showCommandPalette){
    const activeTag = document.activeElement && document.activeElement.tagName;
    if(activeTag !== 'INPUT' && activeTag !== 'TEXTAREA'){
      const searchInput = document.getElementById('search-input');
      if(searchInput){ e.preventDefault(); searchInput.focus(); }
    }
  }
});

function getCommandActions(){
  const actions = [];
  if(state.view.startsWith('admin')){
    if(state.view === 'adminDashboard'){
      actions.push({ label: 'دریافت فایل اکسل', run: ()=>{ document.getElementById('btn-export')?.click(); } });
      actions.push({ label: 'دریافت PDF', run: ()=>{ document.getElementById('btn-export-pdf')?.click(); } });
      actions.push({ label: 'تغییر رمز عبور مدیر', run: ()=>{ state.showPwModal = true; render(); } });
    }
    actions.push({ label: 'خروج مدیر', run: ()=>{ document.getElementById('btn-logout')?.click(); } });
  } else {
    actions.push({ label: 'تغییر حالت روشن/تاریک', run: ()=> toggleTheme() });
    if(state.currentUser){
      actions.push({ label: 'ثبت پرونده جدید', run: ()=>{ state.view = 'public'; state.wizardStep = 0; render(); } });
      actions.push({ label: 'پنل مددجو', run: ()=>{ state.view = 'userDashboard'; render(); } });
    }
  }
  return actions;
}

function renderCommandPalette(){
  const actions = getCommandActions();
  const overlay = el(`<div class="modal-overlay" id="cmdk-overlay">
    <div class="modal" style="max-width:420px; padding:10px;">
      <input type="text" id="cmdk-input" placeholder="جستجوی دستور یا صفحه..." autocomplete="off"
        style="width:100%; padding:12px 14px; border:none; border-bottom:1px solid var(--border); font-family:inherit; font-size:14.5px; background:transparent; color:var(--text);">
      <div id="cmdk-list" style="max-height:280px; overflow-y:auto; padding:6px 0;"></div>
    </div>
  </div>`);
  const listEl = overlay.querySelector('#cmdk-list');
  const inputEl = overlay.querySelector('#cmdk-input');

  function renderList(filter){
    const q = (filter || '').trim();
    const filtered = actions.filter(a => !q || a.label.includes(q));
    listEl.innerHTML = filtered.map((a, i) => `
      <div class="cmdk-item" data-idx="${i}" style="padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px;">${escapeHtml(a.label)}</div>
    `).join('') || `<div style="padding:14px; color:var(--text-muted); font-size:13px;">موردی یافت نشد</div>`;
    listEl.querySelectorAll('.cmdk-item').forEach(item=>{
      item.addEventListener('mouseenter', ()=> item.style.background = 'var(--bg)');
      item.addEventListener('mouseleave', ()=> item.style.background = 'transparent');
      item.addEventListener('click', ()=>{
        state.showCommandPalette = false;
        render();
        filtered[parseInt(item.dataset.idx, 10)].run();
      });
    });
  }
  renderList('');
  inputEl.addEventListener('input', ()=> renderList(inputEl.value));
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ state.showCommandPalette = false; render(); } });
  setTimeout(()=> inputEl.focus(), 30);
  return overlay;
}

/* ============ offline/online detection ============ */
function initOfflineBanner(){
  const banner = el(`<div class="offline-banner" id="offline-banner">اتصال اینترنت قطع است — تغییرات جدید ذخیره نمی‌شوند</div>`);
  document.body.appendChild(banner);
  const update = ()=>{ banner.classList.toggle('show', !navigator.onLine); };
  window.addEventListener('online', update);
  window.addEventListener('offline', update);
  update();
}

/* ============ init ============ */
initTheme();
initOfflineBanner();
render();
restoreSession();
</script>
